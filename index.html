"Termodinâmica (1ª e 2ª leis)":["A 1ª Lei é a conservação da energia aplicada ao calor: o calor recebido por um gás se divide entre o aumento de energia interna e o trabalho realizado por ele. Na expansão o gás realiza trabalho (τ > 0); na compressão recebe trabalho (τ < 0). A 2ª Lei diz que o calor flui espontaneamente do corpo quente para o frio e que nenhuma máquina térmica converte todo o calor em trabalho.",["ΔU = Q − τ","τ = P·ΔV (pressão constante)"],"Atenção aos sinais: Q > 0 quando o gás recebe calor; τ > 0 quando o gás se expande.","Em um cilindro com êmbolo móvel, um gás recebe 500 J de calor de uma chama e, ao se expandir, realiza um trabalho de 200 J sobre o êmbolo.","Qual a variação da energia interna do gás?",["700 J","300 J","200 J","500 J","−300 J"],1,"ΔU = Q − τ = 500 − 200 = 300 J. A energia interna aumenta, o que descarta a E. A alternativa A soma Q e τ; a C e a D consideram só o trabalho ou só o calor, esquecendo que a energia recebida se divide entre os dois destinos."],
"Máquinas térmicas":["Máquinas térmicas (motores, usinas termelétricas) convertem calor em trabalho operando em ciclos entre uma fonte quente e uma fonte fria. Parte do calor recebido vira trabalho e o resto é rejeitado para a fonte fria. O rendimento é sempre menor que 100% (2ª Lei) e o máximo possível é o de Carnot, que depende só das temperaturas absolutas das fontes.",["τ = Q<sub>q</sub> − Q<sub>f</sub>","η = τ / Q<sub>q</sub>","η<sub>Carnot</sub> = 1 − T<sub>f</sub>/T<sub>q</sub> (T em K)"],"Nenhuma máquina tem rendimento de 100%: a energia perdida (calor rejeitado) é o que o ENEM chama de energia dissipada.","Um motor a combustão recebe, a cada ciclo, 2 000 J de calor da queima do combustível (fonte quente) e rejeita 1 400 J para o ambiente (fonte fria).","Qual o rendimento desse motor?",["70%","43%","57%","100%","30%"],4,"τ = Q<sub>q</sub> − Q<sub>f</sub> = 2 000 − 1 400 = 600 J. η = τ/Q<sub>q</sub> = 600/2 000 = 0,30 = 30%. A alternativa A é a fração rejeitada; a B divide τ por Q<sub>f</sub>; a C usa 1 − 600/1 400; a D ignora a energia dissipada, impossível pela 2ª Lei."],
"Efeito estufa e aquecimento global":["A atmosfera é transparente à maior parte da luz solar, que aquece a superfície. A Terra reemite essa energia como radiação infravermelha, e os gases de efeito estufa (vapor d’água, CO₂, CH₄, N₂O) absorvem parte dela e a reemitem em todas as direções, inclusive de volta ao solo. Esse efeito natural mantém o planeta habitável (sem ele, a média seria cerca de −18 °C). O problema é a intensificação, causada por queima de combustíveis fósseis, desmatamento e pecuária.",["Luz solar (visível) → aquece a superfície","Superfície → emite infravermelho","Gases estufa retêm parte do infravermelho"],"Não confunda efeito estufa (retenção de infravermelho) com buraco na camada de ozônio (entrada de radiação ultravioleta).","Cientistas associam o aumento da concentração de CO₂ na atmosfera, desde a Revolução Industrial, ao aquecimento global observado.","Qual mecanismo físico explica como o aumento do CO₂ eleva a temperatura média do planeta?",["O CO₂ abre buracos na camada de ozônio e deixa entrar mais radiação ultravioleta do Sol.","O CO₂ bloqueia a luz visível do Sol e, com isso, a atmosfera retém mais calor.","O aumento do CO₂ faz o Sol emitir mais energia na direção da Terra.","O CO₂ deixa passar a luz solar, mas absorve parte do infravermelho emitido pela superfície e o reemite, retendo calor na atmosfera.","O CO₂ reflete para o espaço o infravermelho emitido pela superfície, resfriando a atmosfera."],3,"A luz visível atravessa a atmosfera e aquece o solo; o solo emite infravermelho, que os gases estufa, como o CO₂, absorvem e reemitem, inclusive para baixo. Mais CO₂ significa mais retenção. A alternativa A confunde com o buraco no ozônio; a B contradiz o fato de a luz visível passar; a C atribui ao Sol uma mudança que não ocorre; a E descreve o oposto do efeito."],
"Ondas e suas classificações":["Onda é uma perturbação que se propaga transportando energia, sem transportar matéria. Ondas mecânicas (som, ondas na água, na corda) precisam de um meio material; ondas eletromagnéticas (luz, rádio, micro-ondas, raios X) se propagam também no vácuo. Quanto à vibração, a onda é transversal (vibração perpendicular à propagação) ou longitudinal (vibração paralela, como o som).",["Mecânica: precisa de meio material","Eletromagnética: propaga-se no vácuo","Transversal: vibração ⊥ propagação","Longitudinal: vibração ∥ propagação"],"O ENEM costuma perguntar por que o som não se propaga no vácuo e a luz sim. Lembre: som = mecânica e longitudinal; luz = eletromagnética e transversal.","Na superfície da Lua, que não tem atmosfera, dois astronautas de traje espacial conseguem conversar por rádio. Se os rádios falhassem, eles não conseguiriam se ouvir diretamente, mesmo estando a poucos metros um do outro.","Qual explicação está correta?",["O som é uma onda eletromagnética, que precisa de meio material para se propagar.","As ondas de rádio são mecânicas e se propagam melhor no vácuo.","O som é uma onda mecânica, que precisa de meio material, ausente na Lua; as ondas de rádio são eletromagnéticas e se propagam no vácuo.","Som e rádio são ondas mecânicas, mas a de rádio tem frequência maior e por isso atravessa o vácuo.","O som é uma onda transversal, que não se propaga em gases; as ondas de rádio são longitudinais."],2,"O som é onda mecânica: sem ar (meio material) não há como a vibração passar de partícula em partícula. As ondas de rádio são eletromagnéticas e não dependem de meio. A alternativa A inverte a natureza do som; a B e a D tratam o rádio como mecânico; a E erra a classificação (o som é longitudinal e se propaga bem em gases)."],
"Reflexão e refração":["Na reflexão, a onda volta ao meio de origem e o ângulo de incidência é igual ao de reflexão. Na refração, a onda passa a outro meio e muda de velocidade (e de direção, se incide obliquamente); a frequência não muda. O índice de refração mede quanto a luz é mais lenta em um meio do que no vácuo.",["n = c / v","n₁·sen θ₁ = n₂·sen θ₂ (Snell)","θ<sub>i</sub> = θ<sub>r</sub> (reflexão)","c = 3 × 10⁸ m/s"],"Quanto maior o índice de refração, menor a velocidade da luz no meio. Na refração, o que se mantém é a frequência.","A fibra óptica usada na internet é feita de vidro com índice de refração 1,5 e transmite informações por pulsos de luz. Considere a velocidade da luz no vácuo igual a 3,0 × 10⁸ m/s.","Qual a velocidade da luz dentro dessa fibra?",["4,5 × 10⁸ m/s","3,0 × 10⁸ m/s","1,5 × 10⁸ m/s","2,25 × 10⁸ m/s","2,0 × 10⁸ m/s"],4,"v = c/n = 3,0 × 10⁸ / 1,5 = 2,0 × 10⁸ m/s. A alternativa A multiplica por n (a luz não fica mais rápida no vidro); a B ignora a mudança de meio; a C subtrai (3,0 − 1,5); a D é o valor para a água (n ≈ 1,33), não para este vidro."],
"Difração e interferência":["Difração é a capacidade da onda de contornar obstáculos e atravessar aberturas, e é mais notável quando o comprimento de onda é comparável ao tamanho do obstáculo ou da fenda. Interferência é a superposição de ondas: se chegam em fase, reforçam-se (construtiva); se chegam em oposição de fase, anulam-se (destrutiva).",["Construtiva: Δd = n·λ","Destrutiva: Δd = (2n + 1)·λ/2","n = 0, 1, 2, …"],"Ouvir alguém atrás de um muro é difração do som; o cancelamento de ruído em fones é interferência destrutiva.","Fones de ouvido com cancelamento ativo de ruído captam o barulho externo (como o de um avião) e emitem outra onda sonora de mesma frequência e mesma amplitude, para reduzir esse ruído.","Qual fenômeno ondulatório explica o funcionamento desses fones?",["Difração, pois o som contorna a cabeça do usuário.","Refração, pois o som muda de meio ao entrar no fone.","Interferência construtiva, pois as duas ondas estão em fase e se somam.","Interferência destrutiva, pois a onda emitida está em oposição de fase com o ruído.","Ressonância, pois o fone vibra na frequência do ruído e o amplifica."],3,"Para anular o ruído, o fone emite uma onda com a mesma frequência e amplitude, mas defasada de meia oscilação (oposição de fase). As ondas se superpõem e se cancelam: interferência destrutiva. Em fase (alternativa C) o ruído dobraria. Difração e refração não anulam ondas, e ressonância aumentaria a amplitude."],
"Ressonância":["Todo sistema oscilante tem frequências naturais de vibração. Quando uma força externa periódica age com frequência igual a uma frequência natural, o sistema recebe energia de forma eficiente e a amplitude cresce muito: é a ressonância. Ela explica o balanço empurrado no ritmo certo, a sintonia do rádio, o rompimento de uma taça por uma nota aguda e o colapso de pontes sob vibração.",["Ressonância: f<sub>externa</sub> = f<sub>natural</sub>","T = 1 / f"],"Cada vez que aparece amplitude aumentando com vibração em ritmo certo, é ressonância. Converta frequência em período com T = 1/f.","Em um parquinho, um balanço oscila livremente com frequência natural de 0,5 Hz. Um pai quer aumentar ao máximo a amplitude do balanço dando um empurrão por ciclo, sempre no mesmo ponto.","Com que intervalo de tempo entre empurrões ele deve agir?",["2 s","0,5 s","1 s","4 s","2,5 s"],0,"Para haver ressonância, os empurrões devem ter a frequência natural do balanço: f = 0,5 Hz, logo T = 1/f = 1/0,5 = 2 s. A alternativa B usa a frequência como se fosse período; a C e a D usam metade e o dobro do período correto; a E soma f e T."],
"Acústica (som)":["O som é uma onda mecânica longitudinal; no ar, sua velocidade é cerca de 340 m/s, maior nos líquidos e sólidos. Qualidades do som: altura (grave ou agudo, depende da frequência), intensidade (fraco ou forte, depende da amplitude, medida em decibéis) e timbre (a “cor” do som, que diferencia instrumentos). O eco ocorre quando o som refletido chega pelo menos 0,1 s depois do original.",["v<sub>som no ar</sub> ≈ 340 m/s","d = v·t","Eco: Δt ≥ 0,1 s"],"Distinguir duas notas iguais de instrumentos diferentes é timbre; grave e agudo é frequência (altura), não intensidade.","Durante uma tempestade, uma pessoa vê o clarão de um relâmpago e ouve o trovão 6 s depois. Considere que a luz chega instantaneamente e que a velocidade do som no ar é 340 m/s.","A que distância aproximada ocorreu a descarga?",["57 m","340 m","2 040 m","4 080 m","1,8 × 10⁹ m"],2,"d = v·t = 340 × 6 = 2 040 m (cerca de 2 km). A alternativa A divide a velocidade pelo tempo; a B ignora o tempo; a D dobra o resultado como se fosse eco (ida e volta), o que não ocorre aqui; a E usa a velocidade da luz em vez da do som."],
"Óptica geométrica":["A óptica geométrica estuda a luz por meio de raios. Seus princípios: propagação retilínea da luz em meios homogêneos, independência dos raios e reversibilidade. Daí vêm as sombras, a penumbra, os eclipses e a câmara escura. Os corpos são classificados em luminosos ou iluminados, e em transparentes, translúcidos ou opacos.",["Triângulos semelhantes: h₁/h₂ = s₁/s₂","Câmara escura: i/o = p′/p"],"Para sombras e câmara escura, monte uma proporção entre triângulos semelhantes, sempre com as mesmas unidades.","Para estimar a altura de um aluno, um professor mede, ao mesmo tempo e em um dia de sol, a sombra de um poste vertical de 6 m, que mede 3,6 m, e a sombra do aluno, que mede 0,9 m.","Qual a altura do aluno?",["0,54 m","1,5 m","2,7 m","3,3 m","5,4 m"],1,"Os raios solares são paralelos, então os triângulos são semelhantes: h/0,9 = 6/3,6 → h = 6 × 0,9 / 3,6 = 1,5 m. A alternativa A inverte a proporção; a C subtrai as sombras; a D subtrai esse resultado da altura do poste; a E multiplica sem dividir."],
"Espelhos, lentes e defeitos da visão":["Espelhos planos formam imagens virtuais, do mesmo tamanho e simétricas ao objeto. Espelhos esféricos e lentes formam imagens conforme a posição do objeto. Lentes convergentes (bordas finas) corrigem a hipermetropia; lentes divergentes (bordas grossas) corrigem a miopia. A vergência (grau) é o inverso da distância focal em metros e é dada em dioptrias (di).",["V = 1/f (f em metros; V em di)","1/f = 1/p + 1/p′","A = −p′/p"],"Convergente: f e V positivas; divergente: f e V negativas. O “grau” do óculos é a vergência em di.","Um estudante com miopia usa óculos com lentes de vergência −2,0 di. Para entender como a lente atua, ele quer saber sua distância focal.","Qual a distância focal dessa lente?",["−2 cm","+50 cm","−50 cm","+2 cm","−0,5 cm"],2,"f = 1/V = 1/(−2) = −0,5 m = −50 cm; o sinal negativo indica lente divergente, adequada para a miopia. A alternativa A confunde di com cm; a B erra o sinal; a D erra o sinal e ainda confunde di com cm; a E esquece de converter metros em centímetros."],
"Carga elétrica e eletrização":["A carga elétrica é uma propriedade da matéria: prótons têm carga positiva e elétrons, negativa. Um corpo neutro tem o mesmo número de prótons e elétrons. Só os elétrons se transferem: quem ganha elétrons fica negativo; quem perde, positivo. A carga total se conserva e é sempre múltipla da carga elementar e.",["Q = n·e","e = 1,6 × 10⁻¹⁹ C","Unidade: coulomb (C)"],"Eletrização por atrito deixa os corpos com cargas opostas; por contato, com cargas de mesmo sinal; por indução, com sinal oposto ao do indutor. Pergunte sempre: quem ganhou ou perdeu elétrons?","Ao pentear o cabelo seco, um pente de plástico fica eletrizado por atrito e passa a atrair pedacinhos de papel. Medições indicam que o pente recebeu 5 × 10¹² elétrons do cabelo.","Qual é a carga elétrica adquirida pelo pente?",["+8 × 10⁻⁷ C","−8 × 10⁻⁷ C","−8 × 10⁻³¹ C","−1,6 × 10⁻¹⁹ C","−3,1 × 10³¹ C"],1,"O pente ganhou elétrons, logo ficou negativo. Q = n·e = 5 × 10¹² × 1,6 × 10⁻¹⁹ = 8 × 10⁻⁷ C, ou seja, −8 × 10⁻⁷ C. A alternativa A erra o sinal (quem recebe elétrons nunca fica positivo); a D é a carga de um único elétron; a C soma os expoentes em vez de combiná-los; a E divide em vez de multiplicar."],
"Lei de Coulomb":["Duas cargas puntiformes se atraem (sinais opostos) ou se repelem (mesmo sinal) com forças de mesma intensidade, mesma direção e sentidos opostos (ação e reação). A intensidade é proporcional ao produto das cargas e inversamente proporcional ao quadrado da distância entre elas.",["F = k·|Q₁·Q₂| / d²","k = 9 × 10⁹ N·m²/C²","1 μC = 10⁻⁶ C"],"Dobrar a distância divide a força por 4; dobrar uma das cargas dobra a força. Converta μC, nC e cm antes de calcular.","Em uma aula de eletrostática, duas pequenas esferas de isopor revestidas de metal, eletrizadas com cargas de 2 μC e 3 μC, são mantidas a 0,3 m uma da outra, no ar.","Qual a intensidade da força elétrica entre elas?",["0,054 N","0,18 N","0,6 N","60 N","5 × 10⁵ N"],2,"F = k·Q₁·Q₂/d² = 9 × 10⁹ × (2 × 10⁻⁶)(3 × 10⁻⁶) / (0,3)² = 5,4 × 10⁻² / 0,09 = 0,6 N. A alternativa A esquece de dividir por d²; a B usa d em vez de d²; a D confunde 0,3 m com 0,03 m; a E soma as cargas em vez de multiplicá-las."],
"Campo elétrico":["Campo elétrico é a região de influência de uma carga: qualquer carga de prova colocada ali sofre força elétrica. O vetor campo aponta para fora de cargas positivas (afastamento) e para dentro de cargas negativas (aproximação). As linhas de campo nunca se cruzam e são mais densas onde o campo é mais intenso.",["E = F / q","E = k·|Q| / d²","Unidade: N/C = V/m"],"Cargas positivas sofrem força no mesmo sentido do campo; negativas, em sentido oposto. Atenção aos prefixos (nC = 10⁻⁹ C).","Em um precipitador eletrostático, usado em chaminés para reter fuligem, mede-se o campo colocando uma carga de prova de 2 nC em um ponto da região. A carga sofre uma força de 6 × 10⁻⁶ N.","Qual a intensidade do campo elétrico nesse ponto?",["1,2 × 10⁻¹⁴ N/C","3,3 × 10⁻⁴ N/C","3 N/C","3 × 10³ N/C","3 × 10⁶ N/C"],3,"E = F/q = 6 × 10⁻⁶ / 2 × 10⁻⁹ = 3 × 10³ N/C. A alternativa A multiplica F por q; a B inverte a razão; a C trata nano como micro (10⁻⁶); a E trata nano como pico (10⁻¹²)."],
"Potencial elétrico":["O potencial elétrico mede a energia por unidade de carga em cada ponto do campo. Entre dois pontos existe uma diferença de potencial (ddp ou tensão), que é o que impulsiona as cargas em um circuito. O trabalho da força elétrica ao levar uma carga entre dois pontos depende apenas da ddp, não do caminho.",["V = k·Q / d","U = V<sub>A</sub> − V<sub>B</sub>","τ = q·U","Unidade: volt (V) = J/C"],"O ENEM cobra a ideia de que corrente só existe onde há ddp. O trabalho é carga vezes ddp (τ = q·U).","Em uma impressora a jato de tinta, gotículas eletrizadas com carga de 2 μC se deslocam entre dois pontos cuja diferença de potencial é de 500 V.","Qual o trabalho realizado pela força elétrica sobre cada gotícula?",["4 × 10⁻⁹ J","2,5 × 10⁸ J","5 × 10² J","1 J","1 × 10⁻³ J"],4,"τ = q·U = 2 × 10⁻⁶ × 500 = 1 × 10⁻³ J. A alternativa A divide q por U; a B divide U por q; a C usa só a ddp; a D trata μC como mC (10⁻³)."],
"Corrente elétrica":["Corrente elétrica é o movimento ordenado de cargas em um condutor, provocado por uma ddp. A intensidade é a carga que atravessa a seção do fio por unidade de tempo. O sentido convencional é o das cargas positivas (contrário ao movimento dos elétrons). Pode ser contínua (pilhas e baterias) ou alternada (tomada).",["i = ΔQ / Δt","Q = i·Δt","1 A = 1 C/s","1 Ah = 3 600 C"],"A capacidade de baterias vem em mAh: divida por 1 000 para obter Ah antes de usar tempo = carga/corrente.","A bateria de um celular tem capacidade de 3 000 mAh. Ela é carregada com corrente constante de 1,5 A, e as perdas podem ser desprezadas.","Quanto tempo leva para carregar a bateria totalmente, partindo de zero?",["2 h","0,5 h","4,5 h","2 000 h","4 500 h"],0,"3 000 mAh = 3 Ah. Δt = Q/i = 3 / 1,5 = 2 h. A alternativa B inverte a divisão; a C multiplica; a D e a E esquecem de converter mAh em Ah."],
"Resistores e Leis de Ohm":["Resistor é o componente que se opõe à passagem da corrente e transforma energia elétrica em calor (efeito Joule). A 1ª Lei de Ohm relaciona tensão e corrente em resistores ôhmicos (R constante). A 2ª Lei mostra que a resistência cresce com o comprimento do fio e diminui com a área da seção.",["U = R·i","R = ρ·L / A","Unidade: ohm (Ω)"],"Fio mais fino e mais longo resiste mais. Em geometrias, lembre que a área depende do quadrado do diâmetro.","Um técnico precisa trocar o fio de cobre de uma instalação por outro do mesmo material, com o dobro do comprimento e o dobro do diâmetro do original, cuja resistência é R.","Qual a resistência do novo fio?",["4R","2R","R","R/2","R/4"],3,"Dobrar o diâmetro quadruplica a área: A' = 4A. R' = ρ·2L/(4A) = R/2. A alternativa B considera só o comprimento; a C trata a área como dobrada; a E considera só a área; a A inverte a lógica."],
"Associação de resistores":["Em série, os resistores são percorridos pela mesma corrente e as resistências se somam. Em paralelo, todos recebem a mesma tensão e a resistência equivalente é menor que a menor delas. Em associações mistas, resolva primeiro os trechos em paralelo ou em série mais internos.",["Série: R<sub>eq</sub> = R₁ + R₂ + …","Paralelo: 1/R<sub>eq</sub> = 1/R₁ + 1/R₂ + …","2 resistores em paralelo: R<sub>eq</sub> = R₁·R₂/(R₁+R₂)"],"Redesenhe o circuito e vá simplificando por etapas. Resistores em paralelo sempre dão equivalente menor que o menor deles.","Em um protótipo de aquecedor, dois resistores de 6 Ω e 3 Ω estão ligados em paralelo, e esse conjunto está em série com um terceiro resistor de 4 Ω.","Qual a resistência equivalente do circuito?",["6 Ω","13 Ω","9 Ω","1,3 Ω","2 Ω"],0,"Paralelo: (6·3)/(6+3) = 2 Ω. Em série com 4 Ω: 2 + 4 = 6 Ω. A alternativa B soma tudo; a C soma 6 + 3; a D coloca os três em paralelo; a E esquece o resistor em série."],
"Geradores, receptores e capacitores":["O gerador transforma outra forma de energia em elétrica; por causa da resistência interna r, a tensão nos terminais é menor que a força eletromotriz ε. Um receptor converte energia elétrica em outra forma (como um motor). O capacitor armazena carga e energia em um campo elétrico entre suas placas.",["U = ε − r·i (gerador)","Q = C·U","E = C·U² / 2","Unidade de C: farad (F)"],"Bateria fornecendo corrente: a tensão útil é menor que a fem, descontada a queda r·i.","A bateria de um automóvel tem força eletromotriz de 12 V e resistência interna de 0,02 Ω. Durante a partida do motor, ela fornece uma corrente de 100 A.","Qual a tensão entre os terminais da bateria nesse momento?",["2 V","6 V","12 V","14 V","10 V"],4,"U = ε − r·i = 12 − 0,02 × 100 = 10 V. A alternativa A é só a queda interna; a B divide ε pela queda; a C ignora a resistência interna; a D soma em vez de subtrair (vale para receptores, não para geradores)."],
"Circuitos elétricos":["Em uma residência os aparelhos são ligados em paralelo, todos sob a mesma tensão da rede; a corrente total é a soma das correntes de cada aparelho. O disjuntor protege a instalação: desarma quando a corrente total ultrapassa seu limite. Por isso ligar muitos aparelhos potentes em uma mesma tomada é perigoso.",["i = P / U","i<sub>total</sub> = i₁ + i₂ + …","P<sub>total</sub> = P₁ + P₂ + …"],"Calcule a corrente total (potência total ÷ tensão) e compare com o limite do disjuntor.","Em uma rede de 120 V protegida por um disjuntor de 15 A, estão disponíveis um ferro de passar (1 000 W), um micro-ondas (1 200 W), uma TV (200 W) e um ventilador (100 W).","Qual combinação, ligada ao mesmo tempo, faz o disjuntor desarmar?",["Ferro, TV e ventilador","Ferro e micro-ondas","Micro-ondas, TV e ventilador","Micro-ondas e TV","Ferro e TV"],1,"O limite é 120 × 15 = 1 800 W. Ferro + micro-ondas = 2 200 W (18,3 A), acima do limite. As demais ficam em 1 300, 1 500, 1 400 e 1 200 W, todas abaixo. Quem acha que a corrente depende só do aparelho mais potente erra: no paralelo, as correntes se somam."],
"Movimento uniforme (MRU)":["Na trajetória retilínea com velocidade constante, o móvel percorre distâncias iguais em tempos iguais e a aceleração é nula. No gráfico s×t o movimento é uma reta inclinada (a inclinação é a velocidade); no gráfico v×t, uma reta horizontal.",["v = Δs / Δt","s = s₀ + v·t","km/h ÷ 3,6 = m/s"],"O ENEM adora misturar unidades: converta tudo para o mesmo sistema antes de calcular.","Uma transportadora programa caminhões para percorrer, em linha reta, os 360 km entre dois centros de distribuição mantendo velocidade constante de 20 m/s. Um caminhão parte às 8 h da manhã.","Qual é o horário previsto de chegada?",["10 h 30 min","12 h","13 h","16 h","2 h do dia seguinte"],2,"20 m/s × 3,6 = 72 km/h. Δt = Δs/v = 360/72 = 5 h. Chegada: 8 h + 5 h = 13 h. Quem usa 20 como se fosse km/h encontra 18 h e cai na alternativa E."],
"Movimento uniformemente variado (MRUV)":["A aceleração é constante e não nula, então a velocidade varia de modo uniforme. Se a velocidade aumenta, o movimento é acelerado; se diminui, é retardado (a aceleração tem sinal oposto ao da velocidade). No gráfico v×t aparece uma reta inclinada, e a área sob ela é o deslocamento.",["v = v₀ + a·t","s = s₀ + v₀·t + a·t²/2","v² = v₀² + 2·a·Δs"],"Em frenagens, a distância cresce com o quadrado da velocidade: dobrou a velocidade, quadruplicou a distância.","Em uma campanha de segurança viária, explica-se que a distância de frenagem aumenta muito com a velocidade. Considere um carro a 20 m/s (72 km/h) que aciona os freios e desacelera uniformemente a 5 m/s² até parar.","Qual a distância percorrida durante a frenagem?",["20 m","30 m","40 m","80 m","100 m"],2,"Por Torricelli: 0 = 20² + 2·(−5)·Δs → 10·Δs = 400 → Δs = 40 m. O tempo de frenagem é 4 s; a alternativa D (80 m) vem de esquecer o fator ½ ao calcular v·t."],
"2ª Lei de Newton":["A força resultante sobre um corpo é o produto de sua massa pela aceleração adquirida, com a mesma direção e sentido dela. Quanto maior a massa (inércia), menor a aceleração para a mesma força. A unidade é o newton: 1 N = 1 kg·m/s².",["F<sub>R</sub> = m·a","1 N = 1 kg·m/s²"],"Desenhe todas as forças que atuam no corpo e some-as (vetorialmente) antes de aplicar F = m·a.","Carros elétricos se destacam pela aceleração rápida. Um deles, de massa 1 200 kg, parte do repouso e atinge 90 km/h (25 m/s) em 10 s, com aceleração constante.","Qual a intensidade da força resultante sobre o carro?",["120 N","1 200 N","3 000 N","12 000 N","30 000 N"],2,"a = Δv/Δt = 25/10 = 2,5 m/s². F<sub>R</sub> = m·a = 1 200 × 2,5 = 3 000 N. A alternativa E (30 000 N) vem de multiplicar a massa pela velocidade, e não pela aceleração."],
"Trabalho":["Trabalho é a energia transferida por uma força ao deslocar um corpo. Só a componente da força na direção do deslocamento realiza trabalho: força perpendicular ao deslocamento (como a normal) realiza trabalho nulo. É positivo quando a força favorece o movimento e negativo quando se opõe (como o atrito). No gráfico F×d, é a área sob a curva.",["τ = F·d·cos θ","Unidade: joule (J) = N·m"],"Carregar uma mala na horizontal, em velocidade constante: a força vertical que você faz é perpendicular ao deslocamento e não realiza trabalho.","Em uma fábrica, um operário puxa um caixote por uma corda inclinada 60° em relação ao piso horizontal, aplicando uma força constante de 50 N e deslocando o caixote por 12 m.","Qual o trabalho realizado pela força do operário?",["Zero","150 J","300 J","520 J","600 J"],2,"τ = F·d·cos 60° = 50 × 12 × 0,5 = 300 J. Os 600 J (E) ignoram o ângulo; os 520 J (D) vêm de usar sen 60°, que seria a componente vertical, a qual não realiza trabalho."],
"Energia mecânica":["Energia mecânica é a soma da energia cinética (movimento) com as energias potenciais (gravitacional e elástica). Em sistemas conservativos, sem atrito nem resistência do ar, ela permanece constante: a energia apenas se converte de uma forma em outra. Com forças dissipativas, parte dela vira calor e a energia mecânica diminui.",["E<sub>m</sub> = E<sub>c</sub> + E<sub>p</sub>","E<sub>c</sub> = m·v²/2","E<sub>p</sub> = m·g·h"],"Quando o enunciado pede a velocidade em função da altura e não cita o tempo, use conservação de energia.","Em um parque de diversões, um carrinho de montanha-russa de massa 400 kg parte do repouso do topo de uma elevação de 20 m de altura. Despreze os atritos e adote g = 10 m/s².","Qual a velocidade do carrinho ao passar pelo ponto mais baixo (altura zero)?",["10 m/s","14 m/s","20 m/s","40 m/s","200 m/s"],2,"m·g·h = m·v²/2 → v² = 2·g·h = 2 × 10 × 20 = 400 → v = 20 m/s. A massa se cancela. A alternativa B (14 m/s) vem de esquecer o fator 2 (√200 ≈ 14)."],
"Potência e energia elétrica":["A potência elétrica indica quanta energia é transformada por segundo. Em um aparelho, P = U·i; em resistores, também P = U²/R = R·i². A energia consumida é potência × tempo; nas contas de luz usa-se o quilowatt-hora (kWh): 1 kWh é a energia de 1 000 W funcionando por 1 hora.",["P = U·i = U²/R","E = P·Δt","1 kWh = 3,6 × 10⁶ J"],"Converta a potência para kW e o tempo para horas antes de multiplicar; o custo é kWh × tarifa.","Um chuveiro elétrico de 5 500 W é usado 20 minutos por dia em uma residência. A distribuidora cobra R$ 0,80 por kWh.","Qual o custo do consumo desse chuveiro em 30 dias?",["R$ 22,00","R$ 33,00","R$ 44,00","R$ 55,00","R$ 66,00"],2,"P = 5,5 kW; tempo total = 20 min × 30 = 600 min = 10 h. E = 5,5 × 10 = 55 kWh. Custo = 55 × 0,80 = R$ 44,00. Os R$ 55,00 (D) correspondem ao consumo em kWh sem multiplicar pela tarifa."],
"Calorimetria":["Calor é energia térmica em trânsito entre corpos de temperaturas diferentes, do mais quente para o mais frio. O calor sensível muda a temperatura (Q = m·c·ΔT); o latente muda o estado físico sem alterar a temperatura (Q = m·L). A água tem calor específico alto, por isso esquenta e esfria devagar, o que modera o clima das regiões litorâneas.",["Q = m·c·ΔT","Q = m·L","1 cal ≈ 4,2 J"],"Em um sistema isolado, no equilíbrio térmico, a soma dos calores trocados é zero: Q₁ + Q₂ = 0.","Um aquecedor solar de baixo custo é usado para aquecer a água do banho. O calor específico da água é 1 cal/(g·°C) e sua densidade é 1 kg/L.","Qual a quantidade de calor necessária para aquecer 2 L de água de 20 °C até 70 °C?",["40 kcal","70 kcal","100 kcal","140 kcal","200 kcal"],2,"2 L = 2 000 g. Q = m·c·ΔT = 2 000 × 1 × (70 − 20) = 100 000 cal = 100 kcal."],
"Equação fundamental da ondulatória":["Toda onda periódica obedece a v = λ·f: a velocidade é o produto do comprimento de onda (distância entre duas cristas) pela frequência (oscilações por segundo, em hertz). A frequência é definida pela fonte e não muda quando a onda troca de meio; a velocidade e o comprimento de onda mudam. No vácuo, as ondas eletromagnéticas viajam a c = 3 × 10⁸ m/s.",["v = λ·f","f = 1/T","c = 3 × 10⁸ m/s"],"Na refração, f permanece constante; se v diminui, λ diminui na mesma proporção.","Uma emissora de rádio FM transmite na frequência de 100 MHz (1 MHz = 10⁶ Hz). As ondas de rádio são eletromagnéticas e se propagam no ar com velocidade aproximada de 3 × 10⁸ m/s.","Qual o comprimento de onda dessa transmissão?",["0,3 m","1,0 m","3,0 m","30 m","300 m"],2,"λ = v/f = (3 × 10⁸)/(100 × 10⁶) = (3 × 10⁸)/10⁸ = 3 m."],
"Empuxo (Arquimedes) e vazão":["Todo corpo mergulhado em um fluido recebe uma força vertical para cima, o empuxo, igual ao peso do fluido deslocado (Princípio de Arquimedes). Se o empuxo supera o peso, o corpo sobe; se é igual, flutua em equilíbrio. Flutua quem tem densidade menor que a do líquido. Vazão é o volume escoado por unidade de tempo: Q = A·v.",["E = ρ<sub>fluido</sub>·g·V<sub>deslocado</sub>","Q = V/Δt = A·v","ρ<sub>água</sub> = 1 000 kg/m³"],"O empuxo depende da densidade do líquido e do volume submerso, e não da massa do corpo nem da profundidade.","Uma boia de sinalização de um lago tem volume de 0,05 m³ e está totalmente submersa em água doce, de densidade 1 000 kg/m³. Adote g = 10 m/s².","Qual a intensidade do empuxo sobre a boia?",["5 N","50 N","500 N","5 000 N","50 000 N"],2,"E = ρ·g·V = 1 000 × 10 × 0,05 = 500 N. A profundidade da boia não entra na conta."]};

function vSim(){return`<h1 class="a">📝 Simulado</h1><p class="a mu">Sequência de questões no estilo ENEM, com cronômetro e placar. Escolha o tamanho:</p><div class="g3">${[10,20,30,94].map((n,k)=>`<button class="cd sm a" style="--i:${k}" onclick="startSim(${n})"><b>${n>=94?"Completo":n}</b><span class="mu">${n>=94?"todos os assuntos":"questões"}</span></button>`).join("")}</div><h2 class="a">Quiz por módulo</h2><div class="chs a">${M.map((m,i)=>`<button class="ch" onclick="startMod(${i})">${IC[i]} ${m.n}</button>`).join("")}</div>`}
function startQuiz(list,title){Q={list,k:0,sel:null,score:0,t0:Date.now(),ans:[],title,saved:0};if(location.hash=="#/q")render();else go("q")}
const startSim=n=>startQuiz(shuf(uniq(FLAT)).slice(0,n),"Simulado · "+(n>=94?"completo":n+" questões")),startMod=i=>startQuiz(shuf(SUB[i].map((x,j)=>({i,j,n:x.n}))),"Quiz · "+M[i].n);
function startRev(){const l=uniq(FLAT).filter(x=>S.wrong[x.n]);if(l.length)startQuiz(shuf(l),"Revisão dos erros")}
const redo=()=>startQuiz(shuf(Q.list.filter((x,k)=>!Q.ans[k].ok)),"Refazendo os erros"),nextQ=()=>{Q.k++;Q.sel=null;render()};
function vQ(){if(!Q){location.replace("#/sim");return null}if(Q.k>=Q.list.length)return vRes();const it=Q.list[Q.k];
return`<div class="bc a"><a href="#/sim">← Sair</a> · ${Q.title}</div><div class="qh a"><b>Questão ${Q.k+1} de ${Q.list.length}</b><span id="qs">✔ ${Q.score}</span><span id="qt">⏱ ${fmt(Math.floor((Date.now()-Q.t0)/1000))}</span></div>${bar(100*Q.k/Q.list.length)}<section class="bx a"><span class="bd ${SUB[it.i][it.j].l}">${M[it.i].n}</span><div id="qb">${qb(it.n,null,1)}</div></section><p class="mu">Atalhos: A–E responde · Enter ou → avança</p>`}
function vRes(){const n=Q.list.length,pc=Math.round(100*Q.score/n),by={};
if(!Q.saved){Q.saved=1;Q.sec=Math.floor((Date.now()-Q.t0)/1000);S.sims.unshift({d:Date.now(),t:Q.title,s:Q.score,n,sec:Q.sec});S.sims=S.sims.slice(0,15);sv()}
Q.ans.forEach((a,k)=>{const m=Q.list[k].i,o=by[m]||(by[m]={a:0,t:0});o.t++;if(a.ok)o.a++});const wr=n-Q.score;
return`<div class="res a">${ring(pc).replace('class="rg"','class="rg big"')}<h1>${pc>=70?"Mandou bem! 🎉":pc>=40?"Bom caminho! 💪":"Vale revisar! 📚"}</h1><p class="mu">${Q.score} de ${n} acertos em ${fmt(Q.sec)} · ${Q.title}</p><div class="row" style="justify-content:center">${wr?`<button class="bt" onclick="redo()">Refazer as ${wr} erradas</button>`:""}<a class="bt gh" href="#/sim">Novo simulado</a><a class="bt gh" href="#/st">Estatísticas</a></div></div><div class="bx a" style="--i:1"><h2>Resultado por módulo</h2>${Object.keys(by).map(m=>`<div class="mr hu" style="--h:${m*24}"><span>${IC[m]} ${M[m].n}</span>${bar(100*by[m].a/by[m].t)}<small>${by[m].a}/${by[m].t}</small></div>`).join("")}</div>`}
function vFc(s){const sc=s===undefined||s===""?-1:+s;if(!FC||FC.sc!=sc)FC={sc,k:0,f:0,list:uniq(FLAT.filter(x=>sc<0||x.i==sc))};
return`<h1 class="a">🃏 Flashcards de fórmulas</h1><div class="chs a"><a class="ch${sc<0?" on":""}" href="#/fc">Todos</a>${M.map((m,i)=>`<a class="ch${sc==i?" on":""}" href="#/fc/${i}" title="${m.n}">${IC[i]}</a>`).join("")}</div><div id="fcx" class="a" style="--i:1">${fcHtml()}</div><div class="row fcb a" style="--i:2"><button class="bt gh" onclick="fcGo(-1)">←</button><button class="bt" onclick="flipFc()">Virar</button><button class="bt gh" onclick="fcGo(1)">→</button><button class="bt gh" onclick="fcShuf()">🔀 Embaralhar</button></div><p class="mu" style="text-align:center">Atalhos: ← → navega · Espaço vira o cartão</p>`}
function fcHtml(){const x=FC.list[FC.k],c=C[x.n];return`<div class="fcnt">${FC.k+1} / ${FC.list.length}</div><div class="fcw"><div class="fcard${FC.f?" flip":""}" onclick="flipFc()"><div class="face"><span class="bd ${x.l}">${M[x.i].n}</span><h2>${x.n}</h2><small class="mu">Toque para ver as fórmulas</small></div><div class="face bk2">${c[1].map(f=>`<code>${f}</code>`).join("")}</div></div></div>`}
const fcGo=d=>{FC.k=(FC.k+d+FC.list.length)%FC.list.length;FC.f=0;q("#fcx").innerHTML=fcHtml()},flipFc=()=>{FC.f^=1;q(".fcard").classList.toggle("flip",!!FC.f)},fcShuf=()=>{FC.list=shuf(FC.list);FC.k=0;FC.f=0;q("#fcx").innerHTML=fcHtml()};
function vSt(){let A=0,E=0;Object.values(S.res).forEach(r=>{A+=r.a;E+=r.e});const T=A+E,cs=[["✅",doneN()+"/"+FLAT.length,"assuntos concluídos"],["🎯",T?Math.round(100*A/T)+"%":"—","de acerto"],["✔",A,"acertos"],["✘",E,"erros"],["⏱",fmt(S.t),"tempo de estudo"],["📝",S.sims.length,"simulados feitos"]];
return`<h1 class="a">📊 Estatísticas</h1><div class="g3">${cs.map((c,k)=>`<div class="bx stat a" style="--i:${k}"><span>${c[0]}</span><b>${c[1]}</b><small>${c[2]}</small></div>`).join("")}</div><h2 class="a">Acertos e erros por módulo</h2><div class="bx a">${M.map((m,i)=>{const s=ms(i);return`<div class="mr"><span>${IC[i]} ${m.n}</span><div class="sb"><i class="g1" data-w="${s.t?100*s.a/s.t:0}"></i><i class="e1" data-w="${s.t?100*s.e/s.t:0}"></i></div><small>${s.t?`${s.a} certas · ${s.e} erradas · ${s.p}%`:"—"}</small></div>`}).join("")}</div><h2 class="a">Últimos simulados</h2>${S.sims.length?`<div class="bx a">${S.sims.map(x=>`<div class="mr2"><span>${new Date(x.d).toLocaleDateString("pt-BR")} · ${x.t}</span><b>${x.s}/${x.n} (${Math.round(100*x.s/x.n)}%)</b><small>${fmt(x.sec)}</small></div>`).join("")}</div>`:`<p class="mu">Nenhum simulado ainda. Comece pela aba Simulado.</p>`}<button class="bt gh" onclick="rst()">Zerar estatísticas</button>`}
function rst(){if(confirm("Zerar acertos, erros, simulados e tempo de estudo? Seu progresso e favoritos continuam salvos.")){S.res={};S.wrong={};S.sims=[];S.t=0;sv();render()}}
function vRv(){const l=uniq(FLAT).filter(x=>S.wrong[x.n]);return`<h1 class="a">🔁 Revisão de erros</h1>`+(l.length?`<p class="a mu">Questões que você errou na última tentativa. Acertar de novo tira da lista.</p><div class="row a"><button class="bt" onclick="startRev()">▶ Refazer as ${l.length} erradas</button></div>`+l.map(row).join(""):`<div class="bx empty a">🎉<p>Nenhum erro pendente. Responda questões nos assuntos ou faça um simulado.</p><a class="bt" href="#/sim">Fazer simulado</a></div>`)}
function vFv(){const l=FLAT.filter(x=>S.fav[x.i+"."+x.j]);return`<h1 class="a">⭐ Favoritos</h1>`+(l.length?l.map(row).join(""):`<div class="bx empty a">⭐<p>Toque na estrela de um assunto para guardá-lo aqui.</p><a class="bt" href="#/">Ver assuntos</a></div>`)}
function render(){const p=location.hash.replace(/^#\/?/,"").split("/"),v=p[0];view=v;st.q=null;let o;
if(v=="m")o=vMod(+p[1]);else if(v=="s"){cur={i:+p[1],j:+p[2]};o=vSub(cur.i,cur.j)}else if(v=="sim")o=vSim();else if(v=="q")o=vQ();else if(v=="fc")o=vFc(p[1]);else if(v=="st")o=vSt();else if(v=="rv")o=vRv();else if(v=="fv")o=vFv();else{view="";o=vHome()}
if(o==null)return;q("#app").innerHTML=o;bars();const act=["m","s",""].includes(view)?"":view=="q"?"sim":view;document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.r==act));scrollTo(0,0)}
function th(){const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme=="dark":matchMedia("(prefers-color-scheme: dark)").matches;S.theme=dark?"light":"dark";d.dataset.theme=S.theme;sv()}
if(S.theme)document.documentElement.dataset.theme=S.theme;
const tick=()=>{const e=q("#tm");if(e)e.textContent=(run?"⏸ ":"⏱ ")+fmt(S.t);const t=q("#qt");if(t&&Q&&Q.k<Q.list.length)t.textContent="⏱ "+fmt(Math.floor((Date.now()-Q.t0)/1000))};
function tmT(){run=!run;tick()}
setInterval(()=>{if(run){S.t++;if(S.t%5==0)sv()}tick()},1000);
addEventListener("keydown",e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)){if(e.key=="Escape")e.target.blur();return}if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key;
if(k=="/"){const s=q("#sq");if(s){e.preventDefault();s.focus()}return}
const oi=k.length==1&&"abcde".includes(k.toLowerCase())?"abcde".indexOf(k.toLowerCase()):"12345".indexOf(k);
if((view=="s"||view=="q")&&oi>=0&&k.length==1){pick(oi);return}
if(k=="ArrowRight"){if(view=="s")navS(1);else if(view=="q"&&Q&&Q.sel!=null)nextQ();else if(view=="fc")fcGo(1)}
else if(k=="ArrowLeft"){if(view=="s")navS(-1);else if(view=="fc")fcGo(-1)}
else if(k==" "&&view=="fc"){e.preventDefault();flipFc()}
else if(k=="Enter"&&view=="q"&&Q&&Q.sel!=null)nextQ();
else if(k=="Escape"&&view!="")go("")});
addEventListener("pagehide",sv);addEventListener("hashchange",render);render();tick();
</script></body></html>
