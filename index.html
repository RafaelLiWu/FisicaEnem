"Grandezas e unidades (SI)":["Grandeza física é tudo o que pode ser medido (comprimento, massa, tempo, força). O Sistema Internacional de Unidades (SI) padroniza as medidas: as unidades de base são metro (m), quilograma (kg), segundo (s), ampere (A), kelvin (K), mol e candela (cd). As demais são derivadas, como newton (N), joule (J), watt (W) e pascal (Pa). Prefixos indicam múltiplos e submúltiplos de dez: quilo (k) 10³, mega (M) 10⁶, giga (G) 10⁹, mili (m) 10⁻³, micro (μ) 10⁻⁶, nano (n) 10⁻⁹.",["k = 10³; M = 10⁶; G = 10⁹","m = 10⁻³; μ = 10⁻⁶; n = 10⁻⁹","km/h ÷ 3,6 = m/s","1 h = 3 600 s"],"Antes de qualquer conta, converta tudo para o SI. A maior parte dos erros do ENEM em Física vem de prefixos e de unidades misturadas.","Um parque eólico instala uma turbina cuja potência nominal é de 2,5 MW (megawatts), suficiente para abastecer cerca de mil residências.","Qual é o valor dessa potência, em watts?",["2,5 × 10³ W","2,5 × 10⁻³ W","2,5 × 10⁹ W","2,5 × 10⁻⁶ W","2,5 × 10⁶ W"],4,"O prefixo mega (M) vale 10⁶, então 2,5 MW = 2,5 × 10⁶ W. A alternativa A usa o prefixo quilo (10³); a B usa mili (10⁻³); a C usa giga (10⁹); a D usa micro (10⁻⁶)."],
"Notação científica e análise dimensional":["Na notação científica, escreve-se um número como a × 10ⁿ, com 1 ≤ a < 10 e n inteiro. Ao multiplicar, somam-se os expoentes; ao dividir, subtraem-se. A ordem de grandeza é a potência de dez mais próxima do valor. A análise dimensional verifica se uma fórmula é coerente: os dois lados de uma equação precisam ter a mesma dimensão (mesmas unidades), e só se somam ou subtraem grandezas de mesma dimensão.",["a × 10ⁿ, com 1 ≤ a < 10","10ᵃ · 10ᵇ = 10ᵃ⁺ᵇ","10ᵃ ÷ 10ᵇ = 10ᵃ⁻ᵇ","[v] = L·T⁻¹; [a] = L·T⁻²; [F] = M·L·T⁻²"],"Em astronomia e física moderna os números vêm em potências de dez; faça primeiro a conversão de unidade e só depois escreva em notação científica.","A distância média entre a Terra e o Sol é de aproximadamente 150 milhões de quilômetros, e as medidas em astronomia costumam ser escritas em notação científica e em unidades do SI.","Como se escreve essa distância, em metros e em notação científica?",["1,5 × 10¹¹ m","1,5 × 10⁸ m","1,5 × 10¹⁰ m","1,5 × 10² m","1,5 × 10¹⁴ m"],0,"150 milhões = 150 × 10⁶ = 1,5 × 10⁸ km. Como 1 km = 10³ m: 1,5 × 10⁸ × 10³ = 1,5 × 10¹¹ m. A alternativa B para em quilômetros; a C conta um zero a menos em “150 milhões” (1,5 × 10⁷); a D escreve só o 150; a E usa 1 km = 10⁶ m."],
"Pêndulo simples":["O movimento harmônico simples (MHS) é um vai e vem periódico em torno de uma posição de equilíbrio, causado por uma força restauradora. O pêndulo simples é uma massa presa a um fio leve; para pequenos ângulos (até cerca de 15°), o período depende apenas do comprimento do fio e da aceleração da gravidade, e não da massa nem da amplitude. Fio mais longo, período maior; gravidade menor, período maior.",["T = 2π·√(L / g)","f = 1 / T"],"A massa e a amplitude (pequena) não aparecem na fórmula. Para dobrar o período, é preciso quadruplicar o comprimento.","Um antigo relógio de pêndulo usa um pêndulo de 2,5 m de comprimento, que oscila com pequenas amplitudes. Adote g = 10 m/s² e π = 3,14.","Qual o período de oscilação desse pêndulo?",["1,6 s","3,1 s","0,5 s","9,9 s","31 s"],1,"T = 2π·√(L/g) = 2π·√(2,5/10) = 2π·√0,25 = 2π × 0,5 = π ≈ 3,1 s. A alternativa A esquece a raiz (2π × 0,25); a C esquece o 2π; a D esquece o g (2π·√2,5); a E usa L·g no lugar de L/g."],
"Sistema massa-mola":["No sistema massa-mola, um corpo preso a uma mola ideal oscila em torno da posição em que a mola não está deformada, sob a força elástica restauradora (F = −k·x). O período depende da massa e da constante da mola: massa maior, período maior; mola mais rígida (k maior), período menor. Não depende da gravidade nem da amplitude. A energia mecânica se alterna entre cinética e potencial elástica.",["T = 2π·√(m / k)","f = 1 / T","E<sub>m</sub> = k·A² / 2"],"O mesmo sistema massa-mola oscila com o mesmo período na Terra e na Lua, porque g não entra na fórmula (ao contrário do pêndulo).","Em um laboratório, um bloco de 0,1 kg preso a uma mola ideal de constante k = 40 N/m oscila sobre uma mesa sem atrito. Adote π = 3,14.","Qual o período de oscilação do bloco?",["0,05 s","0,016 s","0,63 s","0,31 s","126 s"],3,"T = 2π·√(m/k) = 2π·√(0,1/40) = 2π·√0,0025 = 2π × 0,05 ≈ 0,31 s. A alternativa A esquece o 2π; a B esquece a raiz; a C dobra o resultado; a E inverte m e k (2π·√(k/m))."],
"MCU":["No movimento circular uniforme (MCU), a trajetória é uma circunferência e o módulo da velocidade é constante, mas a direção da velocidade muda sempre, então há aceleração centrípeta, apontando para o centro. O período T é o tempo de uma volta; a frequência f é o número de voltas por segundo; a velocidade angular ω mede o ângulo varrido por segundo. A velocidade linear é v = ω·R.",["T = 1 / f","ω = 2π / T = 2π·f","v = ω·R","a<sub>c</sub> = v² / R","rpm ÷ 60 = Hz"],"Rotações por minuto (rpm) precisam virar hertz (÷ 60) antes de usar T = 1/f. Cada ponto de um disco gira com o mesmo ω, mas com v maior quanto mais longe do centro.","Um ventilador de teto gira com velocidade constante de 600 rotações por minuto (rpm), em uma sala de aula.","Qual o período do movimento de uma pá do ventilador?",["0,1 s","10 s","1,7 × 10⁻³ s","60 s","600 s"],0,"f = 600 rpm ÷ 60 = 10 Hz. T = 1/f = 1/10 = 0,1 s (uma volta a cada 0,1 s). A alternativa B toma o período como a própria frequência; a C usa 600 como se fosse hertz (1/600); a D e a E misturam rpm com segundos."],
"MCUV":["No movimento circular uniformemente variado (MCUV), a velocidade angular varia de forma uniforme: a aceleração angular α é constante. As equações são análogas às do MRUV, com ω no lugar de v, α no lugar de a e o ângulo φ no lugar do espaço. Além da aceleração angular (tangencial), continua havendo a aceleração centrípeta.",["ω = ω₀ + α·t","φ = φ₀ + ω₀·t + α·t²/2","α = Δω / Δt (rad/s²)"],"Faça a analogia com o MRUV: troque v por ω, a por α e s por φ, e use as mesmas fórmulas.","O tambor de uma máquina de lavar roupa parte do repouso e, no início da centrifugação, acelera com aceleração angular constante de 2 rad/s².","Qual a velocidade angular do tambor 5 s após a partida?",["0,4 rad/s","2,5 rad/s","7 rad/s","25 rad/s","10 rad/s"],4,"ω = ω₀ + α·t = 0 + 2 × 5 = 10 rad/s. A alternativa A divide α por t; a B divide t por α; a C soma α e t; a D é o ângulo percorrido nesse tempo (α·t²/2 = 25 rad), outra grandeza."],
"Transmissão de movimento circular":["Quando duas polias ou engrenagens estão ligadas por uma correia, corrente ou contato direto, os pontos da borda têm a mesma velocidade linear (v₁ = v₂); como v = ω·R, a polia menor gira mais rápido, com maior frequência. Quando duas polias estão no mesmo eixo, elas têm a mesma velocidade angular ω (e a mesma frequência), mas velocidades lineares diferentes. É o princípio da bicicleta (coroa, catraca e roda).",["Correia ou contato: v₁ = v₂","Mesmo eixo: ω₁ = ω₂","f₁·R₁ = f₂·R₂"],"Raio menor, frequência maior (relação inversa). Pergunte primeiro: mesma correia (mesmo v) ou mesmo eixo (mesmo ω)?","Em uma máquina agrícola, duas polias estão ligadas por uma correia. A polia A, de raio 10 cm, gira a 60 rpm. A polia B, de raio 20 cm, recebe o movimento pela correia, que não desliza.","Com qual frequência a polia B gira?",["15 rpm","20 rpm","30 rpm","60 rpm","120 rpm"],2,"Mesma correia: v<sub>A</sub> = v<sub>B</sub> → f<sub>A</sub>·R<sub>A</sub> = f<sub>B</sub>·R<sub>B</sub> → 60 × 10 = f<sub>B</sub> × 20 → f<sub>B</sub> = 30 rpm. A polia maior gira mais devagar. A alternativa A usa o quadrado da razão dos raios; a B usa a soma dos raios (10 + 20); a D supõe a mesma frequência (vale só para o mesmo eixo); a E inverte a razão."],
"Equilíbrio do ponto material":["Um ponto material está em equilíbrio quando a força resultante sobre ele é nula: em repouso (equilíbrio estático) ou em MRU (equilíbrio dinâmico). Na prática, decompõem-se as forças em horizontal e vertical e iguala-se a soma de cada componente a zero. É a base para calcular trações em cabos e fios que sustentam cargas.",["ΣF = 0","ΣF<sub>x</sub> = 0 e ΣF<sub>y</sub> = 0","F<sub>x</sub> = F·cos θ; F<sub>y</sub> = F·sen θ"],"Cuidado com o ângulo: se ele é medido em relação à horizontal, a componente vertical usa o seno. Cabos mais inclinados (ângulo menor com a horizontal) sofrem tração maior.","Uma luminária de 10 kg é presa ao teto por dois cabos de mesmo tipo, simétricos, cada um formando 30° com a horizontal. Adote g = 10 m/s², sen 30° = 0,5 e cos 30° ≈ 0,87.","Qual a intensidade da tração em cada cabo?",["50 N","87 N","100 N","115 N","200 N"],2,"P = 10 × 10 = 100 N. Na vertical, as componentes dos dois cabos equilibram o peso: 2·T·sen 30° = P → 2·T·0,5 = 100 → T = 100 N. A alternativa A divide P por 2 ignorando o ângulo; a B usa o cosseno (100 × 0,87); a D usa P/cos 30°; a E esquece que são dois cabos (P/sen 30°)."],
"Torque":["Torque (ou momento de uma força) mede a capacidade de uma força de girar um corpo em torno de um eixo. Depende da intensidade da força, da distância do ponto de aplicação ao eixo (braço de alavanca) e do ângulo entre a força e o braço: é máximo quando a força é perpendicular. Por isso se usa uma chave de roda longa para afrouxar parafusos e se coloca a maçaneta da porta longe das dobradiças.",["M = F·d·sen θ","M = F·d (θ = 90°)","Unidade: N·m"],"Para o mesmo esforço, quanto maior o braço, maior o torque. O seno do ângulo só vale 1 quando a força é perpendicular ao braço.","Para soltar um parafuso, um mecânico aplica uma força de 200 N na extremidade de uma chave, a 0,5 m do eixo do parafuso, formando 30° com o cabo da chave. Use sen 30° = 0,5 e cos 30° ≈ 0,87.","Qual o torque da força em relação ao parafuso?",["25 N·m","87 N·m","100 N·m","50 N·m","400 N·m"],3,"M = F·d·sen θ = 200 × 0,5 × 0,5 = 50 N·m. A alternativa C ignora o ângulo (valeria para força perpendicular); a B usa o cosseno (100 × 0,87); a A aplica o fator 0,5 duas vezes; a E divide F por d em vez de multiplicar."],
"Equilíbrio de corpos extensos":["Um corpo extenso está em equilíbrio quando duas condições são satisfeitas: a força resultante é nula (não translação) e a soma dos torques em relação a qualquer ponto é nula (não rotação). Torques que giram no sentido horário se compensam com os de sentido anti-horário. É o princípio de gangorras, balanças, vigas e pontes.",["ΣF = 0","ΣM = 0 (horários = anti-horários)"],"Escolha o ponto de apoio como polo: assim a força no apoio não gera torque e a conta fica mais simples. Quem tem maior massa precisa ficar mais perto do apoio.","Em uma gangorra de prancha rígida de massa desprezível e apoiada no centro, uma criança de 30 kg senta a 2 m do apoio. Do outro lado, senta uma criança de 20 kg para equilibrar a prancha na horizontal.","A que distância do apoio deve sentar a criança de 20 kg?",["1,3 m","3 m","2 m","4,5 m","6 m"],1,"Equilíbrio de torques: P₁·d₁ = P₂·d₂ → 300 × 2 = 200 × d → d = 600/200 = 3 m. A alternativa A inverte as massas; a C supõe a mesma distância (só vale com massas iguais); a D multiplica 30 por 3 e divide por 20; a E divide pela diferença das massas."],
"Alavancas":["Alavanca é uma barra rígida que gira em torno de um ponto fixo (fulcro) e multiplica a força. Interfixa: o fulcro fica entre a força e a carga (tesoura, alicate, gangorra). Inter-resistente: a carga fica entre o fulcro e a força (carrinho de mão, quebra-nozes). Interpotente: a força fica entre o fulcro e a carga (pinça, vara de pescar). Pela condição de equilíbrio, F·b<sub>F</sub> = R·b<sub>R</sub>.",["F·b<sub>F</sub> = R·b<sub>R</sub>","Vantagem mecânica = b<sub>F</sub> / b<sub>R</sub>"],"Quanto maior o braço da força em relação ao braço da carga, menor a força necessária. Braços são medidos a partir do fulcro.","Um carrinho de mão transporta uma carga total de 90 kg, cujo peso atua a 0,4 m do eixo da roda (fulcro). O operário segura as manoplas a 1,2 m do eixo. Adote g = 10 m/s².","Qual a força vertical que o operário precisa aplicar para manter o carrinho em equilíbrio?",["450 N","360 N","900 N","300 N","2 700 N"],3,"Peso: 90 × 10 = 900 N. F·1,2 = 900·0,4 → F = 360/1,2 = 300 N, ou seja, um terço do peso. A alternativa A usa a metade do peso; a B esquece de dividir por 1,2; a C supõe que não há vantagem; a E inverte os braços."],
"Máquinas simples":["Máquinas simples (alavancas, planos inclinados, polias, rodas e eixos) permitem realizar tarefas com menos força, mas nunca com menos trabalho (energia): o que se ganha em força perde-se em distância. No plano inclinado, a força necessária para subir uma carga é menor, e o caminho é mais longo; nas polias móveis, a força cai pela metade e a corda a puxar dobra.",["Plano inclinado: F = P·h / L","Trabalho: τ = F·L = P·h","Polia móvel: F = P / 2"],"Máquina simples não economiza energia: o trabalho é o mesmo, e só a força diminui (com mais deslocamento). Sem atrito, F·L = P·h.","Em uma obra, uma caixa de 100 kg precisa ser colocada sobre a carroceria de um caminhão, a 1 m de altura. Para isso, usa-se uma rampa lisa de 5 m de comprimento. Adote g = 10 m/s².","Qual a força mínima, paralela à rampa, necessária para empurrar a caixa com velocidade constante?",["1 000 N","500 N","200 N","20 N","5 000 N"],2,"P = 100 × 10 = 1 000 N. Sem atrito, F·L = P·h → F = 1 000 × 1 / 5 = 200 N. O trabalho é o mesmo de erguer a caixa na vertical (1 000 J): a rampa diminui a força, não a energia. A alternativa A é a força de erguer direto; a B usa metade do peso; a D erra a potência de dez; a E multiplica P por L."],
"Efeito fotoelétrico":["Efeito fotoelétrico é a emissão de elétrons por um metal quando ele é iluminado. Einstein explicou que a luz é formada por fótons, cada um com energia proporcional à frequência. Um elétron só é ejetado se o fóton tiver energia maior que a função trabalho do metal; abaixo da frequência limite, nenhum elétron sai, por mais intensa que seja a luz. A intensidade só altera o número de elétrons, não a energia deles. Aplica-se em células solares, portões automáticos e fotocopiadoras.",["E<sub>fóton</sub> = h·f","E<sub>c máx</sub> = h·f − φ","h = 6,6 × 10⁻³⁴ J·s"],"A pergunta clássica: mais intensidade ou mais frequência? Mais frequência aumenta a energia de cada elétron; mais intensidade aumenta apenas a quantidade de elétrons.","Em um experimento sobre células fotoelétricas, ilumina-se uma placa metálica. Luz vermelha, mesmo muito intensa, não ejeta nenhum elétron da placa, mas luz violeta, mesmo fraca, ejeta elétrons imediatamente.","Como a física moderna explica esse resultado?",["A luz vermelha é absorvida e vira calor, enquanto a violeta é refletida pelo metal.","A luz vermelha ejeta mais elétrons por ser mais intensa, mas eles ficam presos no metal.","A energia de cada fóton depende da intensidade da luz, e os fótons violeta são mais intensos.","A energia de cada fóton depende da frequência: só os fótons da luz violeta, de maior frequência, têm energia suficiente para superar a função trabalho do metal.","A luz violeta se propaga mais rápido que a vermelha e, por isso, arranca os elétrons."],3,"Cada elétron absorve a energia de um único fóton, E = h·f. Se h·f for menor que a função trabalho, nada sai, não importa quantos fótons cheguem (intensidade). O violeta tem maior frequência e, portanto, fótons mais energéticos. A alternativa C erra ao ligar energia do fóton à intensidade; a E erra, pois no vácuo todas as cores têm a mesma velocidade; A e B contradizem o fenômeno observado."],
"Radioatividade":["Radioatividade é a emissão espontânea de partículas ou energia por núcleos instáveis. Os tipos principais são alfa (núcleo de hélio, pouco penetrante, barrada por papel), beta (elétrons, barrada por lâmina de alumínio) e gama (onda eletromagnética muito penetrante, exige chumbo ou concreto). A meia-vida é o tempo para que metade dos núcleos radioativos de uma amostra decaia, e não depende da quantidade nem de fatores externos.",["N = N₀ / 2ⁿ","n = t / T<sub>1/2</sub>","γ é a mais penetrante, α a menos"],"Para calcular quanto sobra, ache quantas meias-vidas passaram (n = t/T) e divida a massa por 2 n vezes. Aplicações: medicina nuclear, datar fósseis, usinas.","Na medicina nuclear, o iodo-131 é usado no tratamento de problemas na tireoide. Sua meia-vida é de 8 dias. Uma amostra inicial contém 80 mg desse isótopo radioativo.","Qual a massa de iodo-131 que ainda não decaiu após 24 dias?",["5 mg","10 mg","20 mg","26,7 mg","Zero"],1,"24 dias ÷ 8 dias = 3 meias-vidas. A cada meia-vida a massa cai pela metade: 80 → 40 → 20 → 10 mg. A alternativa A conta 4 meias-vidas; a C conta só 2; a D divide 80 por 3; a E supõe que a amostra desaparece, mas a massa só se aproxima de zero, nunca o atinge de uma vez."],
"Física nuclear":["No núcleo, prótons e nêutrons ficam unidos pela força nuclear forte, muito maior que a repulsão elétrica. Na fissão, um núcleo pesado (como o urânio-235) se divide em núcleos menores, liberando energia e nêutrons que sustentam uma reação em cadeia, como nas usinas nucleares. Na fusão, núcleos leves se juntam, como no Sol. Nos dois casos, a massa final é um pouco menor que a inicial, e essa diferença vira energia segundo a equivalência massa-energia.",["E = m·c²","c = 3 × 10⁸ m/s","Fissão: núcleo pesado se divide","Fusão: núcleos leves se unem"],"Massa em kg e c em m/s para obter energia em joules. Fissão: usinas nucleares e bombas; fusão: o Sol e estudos de reatores futuros.","Em um reator nuclear, a fissão do urânio converte uma pequena parte da massa do combustível em energia térmica, que é usada para gerar eletricidade. Suponha que, em um processo, exatamente 1 g de massa seja integralmente convertido em energia. Adote c = 3 × 10⁸ m/s.","Qual a energia liberada nesse processo?",["3 × 10⁵ J","4,5 × 10¹³ J","9 × 10¹⁰ J","9 × 10¹⁶ J","9 × 10¹³ J"],4,"m = 1 g = 10⁻³ kg. E = m·c² = 10⁻³ × (3 × 10⁸)² = 10⁻³ × 9 × 10¹⁶ = 9 × 10¹³ J. A alternativa A usa c e não c²; a B coloca um fator ½ indevido; a C erra a potência de dez; a D usa 1 g sem converter para kg."],
"Relatividade":["A teoria da relatividade restrita de Einstein se apoia em dois postulados: as leis da física são as mesmas em todos os referenciais inerciais, e a velocidade da luz no vácuo é a mesma para todos os observadores. Daí decorrem a dilatação do tempo (um relógio em movimento anda mais devagar, para quem o observa), a contração do comprimento e a equivalência entre massa e energia. Nenhum corpo com massa atinge a velocidade da luz. Os efeitos só são grandes perto da velocidade da luz, mas já afetam satélites de GPS.",["c = 3 × 10⁸ m/s (constante)","Δt = γ·Δt₀; γ = 1/√(1 − v²/c²)","E = m·c²"],"Palavras-chave: a velocidade da luz é constante, o tempo é relativo e massa é energia. O GPS é o exemplo cotidiano mais cobrado.","Os satélites do GPS carregam relógios atômicos extremamente precisos. Sem correções baseadas na teoria da relatividade, os erros de posição calculados pelo sistema cresceriam rapidamente, chegando a quilômetros em poucos dias.","Por que a relatividade precisa ser considerada no funcionamento do GPS?",["Porque os relógios em movimento e sujeitos a campos gravitacionais diferentes marcam o tempo de modo distinto dos relógios na Terra.","Porque a velocidade da luz varia com a velocidade do satélite e isso precisa ser compensado.","Porque os relógios atômicos se desregulam com a falta de gravidade e precisam ser reiniciados.","Porque a atmosfera terrestre atrasa o sinal e a relatividade é usada para compensar esse atraso.","Porque a relatividade só é usada para calcular a órbita, e não afeta os relógios."],0,"Os relógios dos satélites se movem em alta velocidade e estão em um campo gravitacional mais fraco; ambos os fatores fazem o tempo deles passar de modo diferente do tempo na superfície, e uma diferença de bilionésimos de segundo vira erro de metros, se não corrigida. A alternativa B contradiz o 2º postulado (c é constante); a C e a E inventam causas; a D mistura um efeito real da atmosfera, tratado por outro tipo de correção, com a relatividade."],
"Dualidade onda-partícula":["A luz se comporta como onda (difração, interferência) e como partícula (fótons, como no efeito fotoelétrico), dependendo do experimento. De Broglie propôs que toda a matéria também tem comportamento ondulatório, com comprimento de onda inversamente proporcional à quantidade de movimento. Isso foi confirmado quando elétrons produziram padrões de interferência. Para objetos do dia a dia, o comprimento de onda é minúsculo e o efeito não é percebido.",["E = h·f","λ = h / (m·v)","h = 6,6 × 10⁻³⁴ J·s"],"Se aparece interferência ou difração, o comportamento é ondulatório; se aparece efeito fotoelétrico ou impacto pontual, é de partícula. O mesmo objeto quântico pode mostrar os dois.","Em um experimento de laboratório, um feixe de elétrons passa por duas fendas muito próximas e atinge uma tela detectora. Depois de muitos elétrons, a tela exibe um padrão de faixas claras e escuras alternadas, semelhante ao obtido com ondas de luz.","O que esse resultado indica?",["Que a luz é sempre uma partícula, e os elétrons, sempre ondas.","Que elétrons, mesmo sendo partículas, apresentam comportamento ondulatório.","Que o padrão resulta de colisões entre os elétrons durante a travessia das fendas.","Que os elétrons são ondas eletromagnéticas, como a luz.","Que o elétron não tem massa, pois sofre interferência."],1,"Faixas claras e escuras são assinatura de interferência, fenômeno ondulatório. Como o feixe é de elétrons (partículas com massa e carga), o resultado mostra a dualidade onda-partícula da matéria. A alternativa A trata como exclusivas duas descrições complementares; a C não explica o padrão (colisões não geram faixas); a D confunde elétrons com ondas eletromagnéticas; a E contradiz o fato de o elétron ter massa."],
"Impulso":["Impulso é o efeito de uma força que age durante certo tempo: I = F·Δt. Pelo teorema do impulso, o impulso da força resultante é igual à variação da quantidade de movimento. No gráfico F×t, o impulso é a área sob a curva. Para a mesma variação de quantidade de movimento, quanto maior o tempo de interação, menor a força média: é o princípio dos airbags, capacetes e colchões.",["I = F·Δt","I = ΔQ = m·Δv","Unidade: N·s = kg·m/s"],"Airbag, capacete, cinto, redes de segurança: todos aumentam o tempo da colisão para diminuir a força, já que o impulso necessário é o mesmo.","Em um jogo de futebol, um jogador chuta uma bola de 0,5 kg, inicialmente parada, que sai com velocidade de 20 m/s. O contato do pé com a bola dura 0,02 s.","Qual a intensidade média da força que o pé exerce sobre a bola?",["10 N","500 N","1 000 N","5 000 N","50 N"],1,"I = ΔQ = m·Δv = 0,5 × 20 = 10 N·s. F = I/Δt = 10 / 0,02 = 500 N. A alternativa A é o impulso, sem dividir pelo tempo; a C esquece a massa (20/0,02); a D usa 0,002 s; a E usa 0,2 s."],
"Quantidade de movimento":["A quantidade de movimento (ou momento linear) de um corpo é o produto de sua massa pela velocidade. É uma grandeza vetorial, com a direção e o sentido da velocidade. Corpos de massas diferentes podem ter a mesma quantidade de movimento: um caminhão lento e um carro rápido, por exemplo. Ela mede o quão difícil é parar um corpo.",["Q = m·v","Unidade: kg·m/s"],"Não confunda com energia cinética: Q cresce linearmente com v; E<sub>c</sub> cresce com v² e é escalar.","Em uma ciclovia, um ciclista, junto com sua bicicleta, tem massa total de 80 kg e se desloca a 18 km/h em linha reta e com velocidade constante.","Qual o módulo da quantidade de movimento do conjunto?",["16 kg·m/s","80 kg·m/s","400 kg·m/s","1 000 kg·m/s","1 440 kg·m/s"],2,"18 km/h ÷ 3,6 = 5 m/s. Q = m·v = 80 × 5 = 400 kg·m/s. A alternativa A divide m por v; a B é só a massa; a D é a energia cinética (80 × 5²/2 = 1 000 J), outra grandeza; a E usa 18 sem converter para m/s."],
"Conservação da quantidade de movimento":["Em um sistema isolado (a força resultante externa é nula ou desprezível, como em explosões e colisões rápidas), a quantidade de movimento total antes e depois da interação é a mesma. Explica o recuo de armas e canhões, a propulsão de foguetes e o fato de um patinador ser empurrado para trás ao arremessar um objeto. Como Q é vetor, o sinal indica o sentido.",["Q<sub>antes</sub> = Q<sub>depois</sub>","0 = m<sub>1</sub>·v<sub>1</sub> + m<sub>2</sub>·v<sub>2</sub> (sistema inicialmente em repouso)"],"Sistema parado antes: Q total = 0, e os dois corpos saem em sentidos opostos com m₁v₁ = m₂v₂. O de menor massa tem a maior velocidade.","Em uma pista de gelo, sem atrito, um patinador de 60 kg, inicialmente parado, arremessa horizontalmente uma bola de 3 kg com velocidade de 10 m/s em relação ao solo.","Qual a velocidade de recuo do patinador logo após o arremesso?",["0,5 m/s","0,05 m/s","5 m/s","10 m/s","200 m/s"],0,"Q total inicial = 0. Logo: 0 = 60·v + 3·10 → v = −30/60 = −0,5 m/s; o patinador recua a 0,5 m/s, em sentido oposto ao da bola. A alternativa B erra a potência de dez; a C usa 3·10/6; a D supõe que ele recua com a velocidade da bola, ignorando a diferença de massas; a E inverte a razão das massas (60·10/3)."],
"Colisões":["Em toda colisão em sistema isolado, a quantidade de movimento total se conserva. O que muda é a energia cinética: na colisão elástica ela se conserva e os corpos se separam; na inelástica, parte dela se transforma em calor, som e deformação; na perfeitamente inelástica, os corpos seguem juntos depois do choque e a perda de energia cinética é máxima.",["Q<sub>antes</sub> = Q<sub>depois</sub>","Perfeitamente inelástica: m₁v₁ + m₂v₂ = (m₁ + m₂)·v′","E<sub>c</sub> conserva-se só na elástica"],"A quantidade de movimento SEMPRE se conserva em sistema isolado; a energia cinética, não. Se os corpos ficam grudados, use v′ única.","Em um pátio ferroviário, um vagão de 2 000 kg, a 6 m/s, colide com outro vagão parado de 4 000 kg. Os dois se engatam e seguem juntos em linha reta, sem atrito.","Qual a velocidade do conjunto logo após a colisão?",["1 m/s","3 m/s","2 m/s","4 m/s","6 m/s"],2,"Q antes = 2 000 × 6 + 0 = 12 000 kg·m/s. Q depois = (2 000 + 4 000)·v′ = 6 000·v′. Logo v′ = 2 m/s. A energia cinética caiu de 36 000 J para 12 000 J (colisão inelástica). A alternativa A divide por 12 000; a B usa a média aritmética das velocidades; a D inverte a razão das massas; a E supõe que nada muda."],
"Centro de massa":["O centro de massa é o ponto onde se pode considerar concentrada toda a massa de um corpo ou sistema: ele se move como se toda a força externa agisse nele. Em corpos homogêneos e simétricos, coincide com o centro geométrico (centro de uma esfera, de uma barra). Em um campo gravitacional uniforme, coincide com o centro de gravidade, e determina o equilíbrio: o corpo é estável quando a vertical pelo centro de gravidade passa pela base de apoio.",["x<sub>CM</sub> = (m₁x₁ + m₂x₂ + …) / (m₁ + m₂ + …)"],"O centro de massa fica mais próximo do corpo de maior massa. Em equilíbrio de objetos (pilhas, malabaristas, carros), o centro de gravidade deve ficar sobre a base de apoio.","Uma barra leve, de massa desprezível, sustenta duas esferas de metal nas extremidades: uma de 2 kg na posição x = 0 e outra de 6 kg na posição x = 4 m.","Em que posição está o centro de massa do conjunto?",["0 m","1 m","2 m","4 m","3 m"],4,"x<sub>CM</sub> = (2·0 + 6·4) / (2 + 6) = 24/8 = 3 m, mais próximo da esfera mais pesada. A alternativa A é a posição da esfera leve; a B inverte as massas (6·0 + 2·4)/8; a C é o ponto médio, correto só se as massas fossem iguais; a D é a posição da esfera pesada."],
"Leis de Kepler":["A 1ª Lei: os planetas descrevem órbitas elípticas, com o Sol em um dos focos. A 2ª Lei: a reta que liga o planeta ao Sol varre áreas iguais em tempos iguais, então o planeta é mais rápido perto do Sol (periélio) e mais lento longe (afélio). A 3ª Lei: o quadrado do período de revolução é proporcional ao cubo do raio médio da órbita; planetas mais distantes demoram mais para dar uma volta.",["1ª: órbitas elípticas","2ª: áreas iguais em tempos iguais","3ª: T² / R³ = constante"],"Usando a Terra como referência (T = 1 ano, R = 1 UA), a 3ª Lei fica simplesmente T² = R³.","Em uma missão de exploração, astrônomos descobrem um planeta hipotético que orbita o Sol a um raio médio de 4 UA (quatro vezes a distância média entre a Terra e o Sol).","Qual o período de revolução desse planeta, em anos terrestres?",["2 anos","4 anos","16 anos","64 anos","8 anos"],4,"Pela 3ª Lei, com T em anos e R em UA: T² = R³ = 4³ = 64, logo T = 8 anos. A alternativa A usa a raiz de R; a B iguala T a R; a C usa T = R²; a D é R³ sem tirar a raiz quadrada."],
"Lei da Gravitação Universal":["Dois corpos quaisquer se atraem com forças de mesma intensidade e sentidos opostos (ação e reação). A intensidade é proporcional ao produto das massas e inversamente proporcional ao quadrado da distância entre seus centros. Dobrar a distância divide a força por 4; triplicar divide por 9. A força peso é a atração gravitacional do planeta.",["F = G·M·m / d²","G = 6,67 × 10⁻¹¹ N·m²/kg²"],"A distância é medida do CENTRO da Terra. Altura h acima da superfície significa d = R + h.","Um astronauta, com todo o seu equipamento, tem peso de 800 N na superfície da Terra. Ele é levado a uma altitude igual ao raio da Terra, de modo que fica a uma distância do centro da Terra igual ao dobro do raio terrestre.","Qual a intensidade da força gravitacional da Terra sobre ele nessa altitude?",["0 N","100 N","400 N","200 N","800 N"],3,"A força é inversamente proporcional ao quadrado da distância. Dobrando d, F cai a 1/4: 800/4 = 200 N. A alternativa A confunde “sem peso” (aparente, em órbita) com ausência de gravidade; a B usa 1/d³; a C usa 1/d; a E ignora a mudança de distância."],
"Campo gravitacional":["Campo gravitacional é a região de influência da massa de um astro: nela, qualquer outra massa sofre uma força de atração. Sua intensidade é a aceleração da gravidade g naquele ponto e diminui com o quadrado da distância ao centro do astro. Na superfície, g depende da massa e do raio do planeta; por isso muda de um planeta para outro.",["g = G·M / d²","P = m·g","g<sub>Terra</sub> ≈ 10 m/s²"],"Compare com a Terra por proporção: g cresce com a massa M e diminui com o QUADRADO do raio.","Astrônomos descobrem um exoplaneta rochoso, de massa igual ao dobro da massa da Terra e raio igual ao dobro do raio da Terra. Na Terra, g = 10 m/s².","Qual a aceleração da gravidade na superfície desse planeta?",["2,5 m/s²","10 m/s²","20 m/s²","5 m/s²","40 m/s²"],3,"g = G·M/R². Com M’ = 2M e R’ = 2R: g’ = G·2M/(2R)² = (2/4)·G·M/R² = g/2 = 5 m/s². A alternativa A usa R³; a B usa R no lugar de R²; a C considera só a massa; a E multiplica massa e raio."],
"Satélites e órbitas":["Um satélite em órbita circular está em queda livre contínua em torno do planeta: a atração gravitacional faz o papel de força centrípeta. A velocidade orbital diminui com o raio da órbita. Um satélite geoestacionário tem período de 24 h, orbita sobre o equador e parece parado para quem está na Terra (usado em TV e comunicações). A sensação de “imponderância” dentro de uma estação orbital não é ausência de gravidade.",["v = √(G·M / r)","F<sub>grav</sub> = F<sub>centrípeta</sub>","T<sub>geoestacionário</sub> = 24 h"],"Astronautas “flutuam” porque estão em queda livre junto com a estação, e não porque não há gravidade (ela vale cerca de 90% da da superfície na altitude da ISS).","Em vídeos da Estação Espacial Internacional, que orbita a cerca de 400 km de altitude, os astronautas aparecem flutuando dentro da estação.","Qual a explicação física correta para esse fenômeno?",["A gravidade terrestre é nula nessa altitude.","A estação está fora do campo gravitacional da Terra.","A atração da Lua cancela a atração da Terra nessa altitude.","O vácuo do espaço elimina o peso dos corpos.","A estação e os astronautas estão em queda livre: a gravidade atua como força centrípeta e todos têm a mesma aceleração, sem apoio entre si."],4,"A 400 km, a gravidade ainda é cerca de 90% da da superfície; ela é justamente a força que mantém a estação em órbita. Estação e astronautas caem juntos, com a mesma aceleração, e por isso não há normal entre eles: o peso aparente é nulo. As alternativas A e B negam a gravidade; a C e a D inventam causas que não existem."],
"Evolução histórica das teorias":["O modelo geocêntrico (Aristóteles, Ptolomeu) colocava a Terra imóvel no centro do universo. Copérnico propôs o heliocentrismo, com o Sol no centro. Galileu, com a luneta, observou as luas de Júpiter, as fases de Vênus e as crateras da Lua, fortalecendo o heliocentrismo. Kepler, a partir das medições de Tycho Brahe, mostrou que as órbitas são elípticas. Newton unificou tudo na gravitação universal. A ciência avança por observações e modelos que são testados e reformulados.",["Ptolomeu: geocentrismo","Copérnico: heliocentrismo","Galileu: observações com luneta","Kepler: órbitas elípticas","Newton: F = G·M·m/d²"],"Associe cada nome à sua contribuição: Ptolomeu (Terra no centro), Copérnico (Sol no centro), Galileu (observações), Kepler (elipses), Newton (gravitação).","No início do século XVII, Galileu apontou uma luneta para o céu e observou que Júpiter tinha quatro luas orbitando-o e que Vênus apresentava fases semelhantes às da Lua.","Essas observações foram importantes porque:",["fortaleceram o modelo heliocêntrico, ao mostrar que nem tudo orbita a Terra e que Vênus gira em torno do Sol.","comprovaram o modelo geocêntrico de Ptolomeu, em que todos os astros giram em torno da Terra.","demonstraram a lei da gravitação universal, ao medir a força entre Júpiter e suas luas.","revelaram que as órbitas dos planetas são elipses, com o Sol em um dos focos.","mostraram que o Sol gira em torno da Terra, pois Vênus tem fases."],0,"Luas girando em torno de Júpiter mostram que nem todos os corpos celestes giram em torno da Terra, e as fases de Vênus são explicadas se Vênus orbita o Sol: ambos os dados favoreceram Copérnico. A alternativa B afirma o contrário; a C e a D são contribuições posteriores de Newton e Kepler; a E tira uma conclusão oposta à que as observações sustentam."],
"Ímãs e campo magnético":["Ímãs têm dois polos, norte e sul, que não podem ser separados: ao partir um ímã, cada pedaço continua com os dois polos. Polos iguais se repelem e polos opostos se atraem. O campo magnético é representado por linhas que saem do polo norte e entram no polo sul. A Terra se comporta como um grande ímã: o polo sul magnético fica perto do polo norte geográfico, e por isso a bússola funciona.",["Polos iguais se repelem; opostos se atraem","Linhas de campo: saem do N e entram no S","Unidade de B: tesla (T)"],"O polo norte da agulha da bússola aponta para o norte geográfico, onde está o polo SUL magnético da Terra. Essa pegadinha cai muito.","As bússolas, usadas há séculos na navegação, têm uma agulha magnetizada, livre para girar, cuja extremidade norte aponta sempre aproximadamente para o norte geográfico da Terra.","Qual é a explicação física para esse comportamento?",["A Terra se comporta como um grande ímã: perto do polo norte geográfico fica um polo magnético sul, que atrai o polo norte da agulha, pois polos opostos se atraem.","A Terra se comporta como um grande ímã: perto do polo norte geográfico fica um polo magnético norte, que atrai o polo norte da agulha, pois polos iguais se atraem.","A agulha é atraída pelo campo gravitacional, mais intenso nos polos.","A agulha é atraída pelas cargas elétricas da atmosfera, mais concentradas nos polos.","A agulha é atraída por grandes jazidas de minério de ferro concentradas na região do norte geográfico."],0,"Como polos opostos se atraem, o polo norte da agulha só pode ser atraído por um polo magnético sul, que está perto do polo norte geográfico. A alternativa B erra a regra básica (polos iguais se repelem); a C e a D atribuem o fenômeno à gravidade ou a cargas elétricas, que não orientam a agulha; a E atribui o efeito a jazidas de minério, mas o campo magnético da Terra vem do interior do planeta."],
"Força magnética":["Cargas em movimento e correntes elétricas sofrem força quando estão em um campo magnético. A força é perpendicular ao campo e à velocidade (ou à corrente), e seu sentido segue a regra da mão direita. Se a carga está parada, ou se se move paralelamente ao campo, não há força. É o princípio dos motores elétricos e dos alto-falantes. Como a força é perpendicular à velocidade, ela não realiza trabalho.",["Fio: F = B·i·L·sen θ","Carga: F = q·v·B·sen θ","Regra da mão direita"],"Fio perpendicular ao campo: sen 90° = 1, e a conta fica F = B·i·L. Se for paralelo ao campo, sen 0° = 0 e não há força.","No interior de um motor elétrico, um trecho reto de fio de 0,5 m de comprimento, percorrido por uma corrente de 4 A, está perpendicular a um campo magnético uniforme de 0,2 T.","Qual a intensidade da força magnética sobre esse trecho de fio?",["0,04 N","0,4 N","0,8 N","10 N","Zero"],1,"Como o fio é perpendicular ao campo, sen 90° = 1: F = B·i·L = 0,2 × 4 × 0,5 = 0,4 N. A alternativa A erra a potência de dez; a C esquece o comprimento L; a D inverte a relação (i·L/B); a E confunde com o caso paralelo, em que a força é nula."],
"Indução eletromagnética":["Quando o fluxo magnético através de uma espira varia, surge nela uma força eletromotriz induzida (e corrente, se o circuito for fechado). É a Lei de Faraday: quanto mais rápida a variação do fluxo, maior a fem. Pela Lei de Lenz, a corrente induzida cria um campo que se opõe à variação do fluxo. Esse fenômeno está por trás de geradores, dínamos de bicicleta, cooktops e carregadores por indução.",["Φ = B·A·cos θ","ε = ΔΦ / Δt (em módulo)","Unidade de Φ: weber (Wb)"],"Só há fem induzida quando o fluxo VARIA (ímã se movendo, campo mudando ou espira girando). Fluxo constante não induz nada.","O dínamo de uma bicicleta acende o farol quando a roda gira, pois o movimento faz variar o fluxo magnético em uma bobina. Em um teste, o fluxo através de uma espira aumenta de 0,10 Wb para 0,30 Wb em 0,5 s.","Qual o módulo da força eletromotriz média induzida na espira?",["0,4 V","0,2 V","0,6 V","0,1 V","0,8 V"],0,"ΔΦ = 0,30 − 0,10 = 0,20 Wb. ε = ΔΦ/Δt = 0,20 / 0,5 = 0,4 V. A alternativa B não divide pelo tempo; a C usa só o fluxo final (0,30/0,5); a D multiplica ΔΦ por Δt; a E divide duas vezes pelo tempo."],
"Transformadores":["O transformador altera a tensão de uma corrente alternada usando dois enrolamentos (primário e secundário) em torno de um núcleo de ferro; funciona por indução e só com corrente alternada, nunca com contínua. A razão entre as tensões é igual à razão entre os números de espiras. Em um transformador ideal, a potência se conserva: se a tensão sobe, a corrente cai. Por isso a transmissão de energia a longa distância usa alta tensão, para reduzir as perdas por efeito Joule.",["U₁ / U₂ = N₁ / N₂","P₁ = P₂ ⇒ U₁·i₁ = U₂·i₂","Perda Joule: P = R·i²"],"Alta tensão na linha significa corrente menor e perdas menores (R·i²). Transformadores não funcionam com corrente contínua (pilhas).","O carregador de um aparelho eletrônico contém um transformador abaixador que reduz a tensão da tomada, de 220 V, para 12 V. O enrolamento primário tem 1 100 espiras.","Quantas espiras tem o enrolamento secundário?",["6","12","60","600","≈ 2,0 × 10⁴"],2,"U₁/U₂ = N₁/N₂ → 220/12 = 1 100/N₂ → N₂ = 1 100 × 12 / 220 = 60 espiras. A alternativa A e a D erram a potência de dez; a B usa a tensão como se fosse número de espiras; a E inverte a razão (1 100 × 220/12), o que seria um transformador elevador."],
"Densidade e pressão":["Densidade é a razão entre a massa e o volume de um material; a água tem 1 000 kg/m³ (1 g/cm³). Pressão é a razão entre a força perpendicular à superfície e a área sobre a qual ela atua: a mesma força em área menor produz pressão maior. Por isso faca afiada corta, prego tem ponta e esquis têm base larga. A pressão atmosférica ao nível do mar vale cerca de 10⁵ Pa (1 atm).",["d = m / V","p = F / A","Unidade: pascal (Pa) = N/m²","1 atm ≈ 10⁵ Pa"],"Use a força NORMAL (peso, em newtons), não a massa, e converta cm² em m² (1 cm² = 10⁻⁴ m²) antes de dividir.","Uma mulher de 60 kg caminha com sapatos de salto alto. Em um instante, todo o seu peso fica apoiado em um único salto, de área 1 cm² em contato com o piso. Adote g = 10 m/s².","Qual a pressão exercida pelo salto sobre o piso?",["6,0 × 10² Pa","6,0 × 10⁴ Pa","6,0 × 10⁵ Pa","6,0 × 10⁶ Pa","6,0 × 10⁸ Pa"],3,"Peso: P = m·g = 60 × 10 = 600 N. Área: 1 cm² = 10⁻⁴ m². p = F/A = 600 / 10⁻⁴ = 6,0 × 10⁶ Pa. A alternativa A esquece de dividir pela área; a B converte 1 cm² em 10⁻² m²; a C usa a massa (60) no lugar do peso; a E converte 1 cm² em 10⁻⁶ m²."],
"Teorema de Stevin":["Em um líquido em equilíbrio, a pressão aumenta com a profundidade, porque cada ponto suporta o peso da coluna de líquido acima dele. A diferença de pressão entre dois pontos depende só da densidade do líquido, da gravidade e da diferença de profundidade, não do formato do recipiente. Na superfície livre atua a pressão atmosférica; a pressão total em um ponto é a soma das duas.",["Δp = ρ·g·Δh","p = p<sub>atm</sub> + ρ·g·h","ρ<sub>água</sub> = 1 000 kg/m³"],"Pressão total = atmosférica + hidrostática. A pressão aumenta cerca de 1 atm a cada 10 m de água.","Um mergulhador desce a 20 m de profundidade em um lago de água doce (densidade 1 000 kg/m³). A pressão atmosférica na superfície é 1 × 10⁵ Pa. Adote g = 10 m/s².","Qual a pressão total sobre o mergulhador nessa profundidade?",["1 × 10⁵ Pa","2 × 10⁵ Pa","3 × 10⁶ Pa","4 × 10⁵ Pa","3 × 10⁵ Pa"],4,"Pressão da coluna de água: ρ·g·h = 1 000 × 10 × 20 = 2 × 10⁵ Pa. Pressão total: p = p<sub>atm</sub> + ρ·g·h = 1 × 10⁵ + 2 × 10⁵ = 3 × 10⁵ Pa (3 atm). A alternativa A esquece a água; a B esquece a atmosfera; a C erra a potência de dez; a D soma a pressão atmosférica duas vezes."],
"Princípio de Pascal":["Toda variação de pressão aplicada a um ponto de um fluido em equilíbrio, dentro de um recipiente fechado, é transmitida integralmente a todos os pontos do fluido e às paredes do recipiente. É o princípio da prensa hidráulica, do macaco hidráulico e dos freios de carro: uma força pequena em um êmbolo de área pequena equilibra uma força grande em um êmbolo de área grande. A força é multiplicada, mas o trabalho não: o êmbolo menor desloca-se mais.",["F₁ / A₁ = F₂ / A₂","Δp transmitida integralmente","Trabalho: F₁·d₁ = F₂·d₂"],"Prensa hidráulica ganha em força, mas não em energia: a força cresce na razão das áreas, e o deslocamento diminui na mesma razão.","Em uma oficina, um macaco hidráulico tem êmbolo menor de área 10 cm² e êmbolo maior de área 200 cm². O mecânico aplica uma força de 100 N no êmbolo menor.","Qual a força transmitida ao êmbolo maior, que levanta o carro?",["5 N","2 000 N","100 N","10 000 N","20 000 N"],1,"Pela prensa: F₁/A₁ = F₂/A₂ → 100/10 = F₂/200 → F₂ = 100 × 200 / 10 = 2 000 N. A alternativa A inverte a razão das áreas; a C supõe que a força se conserva; a D e a E resultam de multiplicar sem dividir ou de erro na conversão de unidades."],
"Gráficos do movimento":["Os gráficos resumem o movimento. No gráfico s×t, a inclinação da curva é a velocidade (reta inclinada = MU; parábola = MUV). No gráfico v×t, a inclinação é a aceleração e a área sob a curva é o deslocamento. No gráfico a×t, a área é a variação de velocidade. Reta horizontal em v×t significa velocidade constante.",["s×t: inclinação = v","v×t: inclinação = a","v×t: área = Δs","a×t: área = Δv"],"O ENEM descreve ou mostra o gráfico: calcule áreas de retângulos e triângulos, e sempre confira as unidades dos eixos.","O gráfico da velocidade em função do tempo de um ciclista mostra que, partindo do repouso, ele aumenta a velocidade de modo uniforme até 10 m/s em 5 s e, em seguida, mantém essa velocidade constante por mais 5 s.","Qual a distância total percorrida nos 10 s?",["75 m","100 m","50 m","25 m","150 m"],0,"A área sob o gráfico v×t é o deslocamento. 1º trecho (triângulo): 5 × 10 / 2 = 25 m. 2º trecho (retângulo): 10 × 5 = 50 m. Total: 25 + 50 = 75 m. A alternativa B supõe 10 m/s durante os 10 s; a C considera só o retângulo; a D só o triângulo; a E dobra o resultado correto."],
"Velocidade relativa":["Velocidade relativa é a velocidade de um móvel medida em relação a outro. Em movimentos de mesmo sentido, subtraem-se as velocidades; em sentidos opostos, somam-se. Usa-se para calcular tempos de encontro e de ultrapassagem: o tempo é a distância (ou comprimento) dividido pela velocidade relativa.",["Mesmo sentido: v<sub>rel</sub> = |v₁ − v₂|","Sentidos opostos: v<sub>rel</sub> = v₁ + v₂","t = d / v<sub>rel</sub>"],"Em encontros de móveis que vêm em sentidos contrários, some as velocidades; em ultrapassagens, subtraia.","Dois carros trafegam em uma estrada reta, um em direção ao outro, a 80 km/h e a 60 km/h. No instante inicial, a distância entre eles é de 70 km.","Em quanto tempo os carros se encontram?",["3,5 h","1 h 10 min","52 min","30 min","1 h"],3,"Em sentidos opostos: v<sub>rel</sub> = 80 + 60 = 140 km/h. t = 70/140 = 0,5 h = 30 min. A alternativa A subtrai as velocidades (70/20); a B e a C usam a velocidade de um só carro (70/60 e 70/80); a E usa a média aritmética (70/70)."],
"Vetores":["Grandezas escalares ficam completas só com o valor e a unidade (massa, tempo, energia); as vetoriais precisam também de direção e sentido (deslocamento, velocidade, aceleração, força). Vetores se somam geometricamente: para vetores perpendiculares, o módulo da resultante vem do teorema de Pitágoras; na mesma direção, somam-se ou subtraem-se os módulos. Um vetor pode ser decomposto em componentes x e y.",["Perpendiculares: R² = a² + b²","Mesma direção e sentido: R = a + b","Sentidos opostos: R = |a − b|","v<sub>x</sub> = v·cos θ; v<sub>y</sub> = v·sen θ"],"Perpendiculares: Pitágoras. Os trios pitagóricos 3-4-5 e 5-12-13 aparecem com frequência.","Um ciclista percorre 3 km para o leste e, em seguida, 4 km para o norte, em um percurso por ruas em ângulo reto.","Qual o módulo do deslocamento do ciclista, em relação ao ponto de partida?",["7 km","5 km","1 km","12 km","25 km"],1,"Os deslocamentos são perpendiculares: d² = 3² + 4² = 9 + 16 = 25 → d = 5 km. A alternativa A soma os módulos (só vale na mesma direção e sentido); a C subtrai; a D multiplica; a E esquece de tirar a raiz quadrada."],
"Lançamento horizontal":["No lançamento horizontal, o corpo sai com velocidade horizontal v₀ e passa a cair sob ação da gravidade. Os dois movimentos são independentes: na horizontal é MU (v constante); na vertical, queda livre a partir do repouso vertical. O tempo de queda depende só da altura (não da velocidade horizontal), e o alcance horizontal é v₀ vezes o tempo de queda. A trajetória é um arco de parábola.",["t<sub>queda</sub> = √(2h / g)","Alcance: A = v₀·t","Horizontal: x = v₀·t; vertical: y = g·t²/2"],"Calcule primeiro o tempo de queda (vertical); depois use-o na horizontal para o alcance.","Um helicóptero que voa na horizontal a 30 m/s, a 80 m de altura, solta um pacote de ajuda humanitária. Despreze a resistência do ar e adote g = 10 m/s².","Qual a distância horizontal percorrida pelo pacote até atingir o solo?",["30 m","80 m","120 m","480 m","2 400 m"],2,"Tempo de queda: 80 = 10·t²/2 → t² = 16 → t = 4 s. Alcance: A = v₀·t = 30 × 4 = 120 m. A alternativa A é só v₀; a B é a altura; a D esquece a raiz (t = 2h/g = 16 s); a E multiplica a velocidade pela altura."],
"Lançamento oblíquo":["No lançamento oblíquo, o corpo é lançado com velocidade v₀ formando um ângulo θ com a horizontal. Decompõe-se: v₀x = v₀·cos θ (constante) e v₀y = v₀·sen θ (movimento de subida e descida). No ponto mais alto, v<sub>y</sub> = 0, mas v<sub>x</sub> continua, então a velocidade não é nula. Sem resistência do ar, o alcance máximo ocorre a 45°, e ângulos complementares dão o mesmo alcance.",["v₀ₓ = v₀·cos θ","v₀<sub>y</sub> = v₀·sen θ","t<sub>voo</sub> = 2·v₀·sen θ / g","A = v₀²·sen 2θ / g"],"O tempo de voo depende só da componente vertical; o alcance depende das duas. No topo, a velocidade é horizontal, não zero.","Em um treino de futebol, uma bola é chutada com velocidade de 20 m/s, formando 30° com o solo horizontal. Despreze a resistência do ar. Adote g = 10 m/s², sen 30° = 0,5 e cos 30° ≈ 0,87.","Quanto tempo a bola permanece no ar, até voltar ao nível do chute?",["1 s","1,75 s","3,5 s","4 s","2 s"],4,"v₀y = 20 × 0,5 = 10 m/s. Subida: t = v₀y/g = 1 s; total = 2 × 1 = 2 s. A alternativa A é só a subida; a B e a C usam o cosseno (componente horizontal) em vez do seno; a D usa a velocidade total (2·v₀/g), que só vale para lançamento vertical."],
"Composição de movimentos":["Princípio da independência (Galileu): quando um corpo realiza dois movimentos ao mesmo tempo, cada um acontece como se o outro não existisse, e o movimento resultante é a soma vetorial dos dois. É o caso do barco que atravessa um rio com correnteza: ele se move em relação à água e a água se move em relação à margem. O tempo de travessia depende só da componente perpendicular às margens.",["v<sub>res</sub> = v<sub>barco</sub> + v<sub>água</sub> (vetorial)","Perpendiculares: v<sub>res</sub>² = v<sub>b</sub>² + v<sub>a</sub>²","t = L / v<sub>b⊥</sub>"],"Em travessias de rio, a correnteza não altera o tempo para atravessar; ela só desloca o barco rio abaixo.","Um barco atravessa um rio de 120 m de largura, com o motor mantendo o barco sempre apontado perpendicularmente às margens, com velocidade de 4 m/s em relação à água. A correnteza tem velocidade de 3 m/s.","Qual a distância que o barco é arrastado rio abaixo ao chegar à outra margem?",["30 m","45 m","90 m","120 m","150 m"],2,"Tempo de travessia: t = 120/4 = 30 s (só a velocidade perpendicular conta). Arrasto: 3 × 30 = 90 m. A alternativa A é o tempo; a D é a largura do rio; a E é o comprimento da trajetória (v<sub>res</sub> = 5 m/s × 30 s); a B não decorre da conta."],
"Referencial e trajetória":["Movimento e repouso dependem do referencial: um corpo pode estar parado para um observador e em movimento para outro. A trajetória (caminho descrito pelo corpo) também depende do referencial. Por isso toda descrição de movimento exige dizer em relação a quê.",["Repouso e movimento são relativos","Trajetória depende do referencial"],"O ENEM gosta de cenas com dois observadores (piloto e quem está no solo, passageiro e pedestre). Responda sempre indicando o referencial de cada um.","Um avião de carga voa em linha reta, horizontal e com velocidade constante, e solta um pacote de suprimentos. Despreze a resistência do ar. Um observador está no avião e outro, parado, no solo.","Como cada observador descreve a trajetória do pacote?",["Os dois veem o pacote cair em linha reta vertical.","Os dois veem o pacote descrever uma parábola.","O piloto vê uma parábola; o observador no solo vê uma reta vertical.","A trajetória é a mesma para qualquer observador, pois é propriedade do pacote.","O piloto vê o pacote cair em linha reta vertical; o observador no solo vê um arco de parábola."],4,"O pacote mantém a velocidade horizontal do avião e, por isso, fica sempre abaixo dele: para o piloto, cai em linha reta. Para quem está no solo, o pacote mantém o avanço horizontal enquanto cai, e a trajetória é um arco de parábola. As alternativas A, B e C trocam ou igualam os referenciais; a D erra ao dizer que a trajetória não depende do observador."],
"Posição e deslocamento":["Posição é o local onde o corpo está sobre a trajetória, medido a partir de uma origem. Deslocamento escalar é a variação de posição (final menos inicial) e pode ser positivo, negativo ou nulo. A distância percorrida é o comprimento total do caminho e nunca é negativa. Só coincidem quando o movimento é em um único sentido.",["Δs = s<sub>final</sub> − s<sub>inicial</sub>","Distância percorrida = soma dos trechos"],"Se o corpo volta ao ponto de partida, o deslocamento é zero, mas a distância percorrida não.","Um ciclista parte do marco 10 km de uma rodovia, vai até o marco 40 km e, em seguida, retorna até o marco 25 km, onde para para descansar.","Qual é o deslocamento escalar e a distância total percorrida pelo ciclista?",["Deslocamento 15 km; distância 15 km","Deslocamento 15 km; distância 45 km","Deslocamento 45 km; distância 45 km","Deslocamento 30 km; distância 45 km","Deslocamento 15 km; distância 30 km"],1,"Δs = 25 − 10 = 15 km. A distância soma a ida (40 − 10 = 30 km) e a volta (40 − 25 = 15 km): 45 km. A alternativa A iguala as duas grandezas; a C usa a distância (45 km) também como deslocamento; a D toma só o trecho de ida (30 km) como deslocamento; a E esquece o trecho de volta."],
"Velocidade média":["Velocidade média é a razão entre o deslocamento e o intervalo de tempo gasto. Em trajetos com trechos diferentes, é preciso usar o espaço total e o tempo total; não é, em geral, a média aritmética das velocidades. No SI é dada em m/s, e km/h ÷ 3,6 = m/s.",["v<sub>m</sub> = Δs / Δt","km/h ÷ 3,6 = m/s"],"Pegadinha clássica: dois trechos de mesma distância com velocidades diferentes NÃO dão a média aritmética, porque se gasta mais tempo no trecho lento.","Em uma viagem por uma estrada reta, um carro percorre a primeira metade do trajeto a 60 km/h e a segunda metade a 90 km/h.","Qual a velocidade média no percurso inteiro?",["60 km/h","70 km/h","90 km/h","75 km/h","72 km/h"],4,"Seja d cada metade. Tempos: d/60 + d/90 = (3d + 2d)/180 = 5d/180 = d/36. Velocidade média = 2d / (d/36) = 72 km/h. A alternativa D é a média aritmética (60 + 90)/2 = 75, errada porque o carro passa mais tempo no trecho lento; A e C consideram só um dos trechos."],
"Aceleração média":["Aceleração média é a variação de velocidade por unidade de tempo e indica o quão rápido a velocidade muda. Aceleração positiva não significa necessariamente aumento de velocidade: depende do sinal da velocidade. A unidade no SI é o m/s², que significa ganhar (ou perder) tantos m/s a cada segundo.",["a<sub>m</sub> = Δv / Δt","Unidade: m/s²"],"Antes de dividir, converta km/h em m/s (÷ 3,6). A unidade final deve ser m/s².","Um carro esportivo é anunciado como capaz de passar de 0 a 108 km/h em 6 s, em linha reta.","Qual a aceleração média do carro nesse intervalo?",["0,2 m/s²","5 m/s²","18 m/s²","30 m/s²","180 m/s²"],1,"108 km/h ÷ 3,6 = 30 m/s. a = Δv/Δt = 30/6 = 5 m/s². A alternativa A inverte a razão; a C divide 108 por 6 sem converter a unidade; a D é a velocidade final; a E multiplica 30 por 6."],
"Equação de Torricelli":["A equação de Torricelli relaciona velocidades, aceleração e deslocamento no MRUV sem precisar do tempo. É a ferramenta ideal quando o enunciado não cita o tempo, como em frenagens, quedas e lançamentos.",["v² = v₀² + 2·a·Δs"],"Se o enunciado não fala em tempo, pense em Torricelli. Em frenagem, a < 0 e v final = 0.","Um avião toca a pista de pouso a 60 m/s e, desacelerando uniformemente a 3 m/s², freia até parar completamente.","Qual a distância percorrida pelo avião na pista até parar?",["20 m","180 m","600 m","1 200 m","10 800 m"],2,"0 = 60² + 2·(−3)·Δs → 6·Δs = 3 600 → Δs = 600 m. A alternativa A divide v por a; a B multiplica v por a; a D esquece o fator 2 da equação; a E multiplica v² por a."],
"Queda livre":["Queda livre é o movimento de um corpo abandonado, sob ação apenas do peso (sem resistência do ar). É um MRUV com aceleração g ≈ 10 m/s², para baixo, e todos os corpos caem com a mesma aceleração, independentemente da massa. No vácuo, uma pena e uma pedra chegam juntas ao solo.",["v = g·t","h = g·t² / 2","v² = 2·g·h"],"A massa NÃO aparece nas fórmulas de queda livre. Altura cresce com o quadrado do tempo: dobrar o tempo quadruplica a altura.","Durante uma obra, uma ferramenta escorrega de um andaime e cai verticalmente, a partir do repouso, levando 3 s para atingir o solo. Despreze a resistência do ar e adote g = 10 m/s².","De que altura a ferramenta caiu?",["45 m","30 m","15 m","90 m","4,5 m"],0,"h = g·t²/2 = 10 × 3² / 2 = 10 × 9 / 2 = 45 m. A alternativa B é a velocidade final (30 m/s) tomada como altura; a C usa g·t/2; a D esquece o fator ½; a E erra a potência de dez."],
"Lançamento vertical":["No lançamento vertical, o corpo é lançado para cima com velocidade inicial v₀ e sofre a aceleração da gravidade, que o freia na subida e o acelera na descida. No ponto mais alto, a velocidade é zero (mas a aceleração continua sendo g). Sem resistência do ar, o tempo de subida é igual ao de descida, e o corpo volta com a mesma velocidade escalar com que foi lançado.",["v = v₀ − g·t","H = v₀² / (2·g)","t<sub>subida</sub> = v₀ / g","t<sub>total</sub> = 2·v₀ / g"],"No ponto mais alto v = 0, mas a=g ainda. Tempo total = 2 × tempo de subida.","Em um treino de basquete, uma bola é lançada verticalmente para cima com velocidade de 20 m/s. Despreze a resistência do ar e adote g = 10 m/s².","Quanto tempo a bola leva, desde o lançamento, para voltar à altura de onde saiu?",["1 s","2 s","3 s","4 s","8 s"],3,"Tempo de subida: v = v₀ − g·t → 0 = 20 − 10·t → t = 2 s. Descida leva o mesmo tempo, então o total é 4 s. A alternativa B considera só a subida; a E dobra novamente o tempo total."],
"1ª Lei de Newton (inércia)":["Um corpo em repouso tende a permanecer em repouso e um corpo em movimento tende a manter sua velocidade, em linha reta e constante, enquanto a força resultante sobre ele for nula. Essa tendência é a inércia, e a massa é a medida dela: quanto maior a massa, maior a inércia. Repouso e MRU são os dois estados de equilíbrio.",["F<sub>R</sub> = 0 ⇒ repouso ou MRU","Massa = medida da inércia"],"Cinto de segurança, toalha puxada de baixo de pratos, ônibus que freia ou arranca: o ENEM adora esses cenários. A explicação é sempre a inércia, e não uma força “empurrando” o corpo.","Dentro de um ônibus em movimento, os passageiros em pé são projetados para a frente quando o motorista freia bruscamente. Para que isso não ocorra, recomenda-se segurar nos apoios.","Qual princípio físico explica o movimento dos passageiros?",["Uma força para a frente empurra os passageiros quando o ônibus freia.","A força de ação do freio é igual à de reação, e por isso os passageiros se movem.","O peso dos passageiros aumenta na frenagem e gera aceleração para a frente.","A inércia só existe em corpos em repouso, e os passageiros estavam parados.","Por inércia, os passageiros tendem a manter a velocidade que tinham, enquanto o ônibus é desacelerado pelos freios."],4,"Os passageiros mantêm a velocidade que já possuíam (1ª Lei); o ônibus é que desacelera, pois só ele recebe a força de frenagem. Em relação ao ônibus, eles parecem ir para a frente. A alternativa A inventa uma força; a B mistura 3ª Lei com o fenômeno; a C erra, pois o peso não muda; a D erra, pois a inércia vale também para corpos em movimento."],
"3ª Lei de Newton (ação e reação)":["Quando um corpo A exerce força sobre um corpo B, B exerce sobre A uma força de mesma intensidade, mesma direção e sentido oposto. As duas forças aparecem juntas, têm a mesma natureza e atuam em corpos diferentes; por isso nunca se anulam. É assim que um nadador se impulsiona, um foguete sobe e um barco anda quando se empurra o remo.",["F<sub>A→B</sub> = −F<sub>B→A</sub>","Atuam em corpos diferentes"],"Ação e reação nunca se cancelam, porque estão aplicadas em corpos distintos. Um erro comum é achar que a força maior “vence”.","Em uma prova de natação, o atleta faz a virada empurrando a parede da piscina com os pés, com uma força de intensidade 200 N, para ser lançado em sentido contrário.","Qual a força que a parede exerce sobre o nadador nesse instante?",["Zero, pois a parede está parada.","200 N, no sentido contrário ao da força do nadador sobre a parede.","200 N, no mesmo sentido da força do nadador sobre a parede.","400 N, pois a parede soma a sua própria força.","100 N, pois a força se divide entre os dois corpos."],1,"Pela 3ª Lei, a parede reage com força de mesma intensidade (200 N), mesma direção e sentido oposto, e é essa força que lança o nadador. A alternativa A ignora a reação (estar parada não anula a força); a C erra o sentido; a D e a E inventam soma ou divisão que a lei não prevê."],
"Força peso":["O peso é a força com que um planeta atrai um corpo; aponta para o centro do planeta e é dado por P = m·g. Massa é a quantidade de matéria e não muda de lugar para lugar; já o peso depende da aceleração da gravidade local. Por isso um astronauta tem a mesma massa na Terra e na Lua, mas pesa cerca de seis vezes menos na Lua.",["P = m·g","g<sub>Terra</sub> ≈ 10 m/s²","g<sub>Lua</sub> ≈ 1,6 m/s²","Unidade do peso: newton (N)"],"Massa em kg (constante); peso em N (muda com g). Calcule a massa primeiro, a partir do peso na Terra.","Antes de uma missão, um astronauta com seu equipamento tem peso de 1 000 N na Terra, onde g = 10 m/s². Na superfície da Lua, a aceleração da gravidade é de aproximadamente 1,6 m/s².","Quais são a massa e o peso do conjunto na Lua?",["Massa 16 kg e peso 160 N","Massa 100 kg e peso 1 000 N","Massa 100 kg e peso 625 N","Massa 62,5 kg e peso 625 N","Massa 100 kg e peso 160 N"],4,"Na Terra: m = P/g = 1 000/10 = 100 kg. A massa não muda. Na Lua: P = m·g = 100 × 1,6 = 160 N. A alternativa A faz a massa mudar; a B supõe que nada muda; a C divide o peso por 1,6 em vez de multiplicar; a D divide tudo por 1,6."],
"Força normal e tração":["A força normal é a reação de apoio de uma superfície e é sempre perpendicular a ela; a tração é a força transmitida por fios, cordas e cabos, sempre puxando. Em um plano horizontal sem outras forças verticais, N = P, mas isso deixa de valer quando há aceleração vertical (elevador) ou outras forças. O peso aparente é o que a balança indica: o valor de N.",["N = P (horizontal, equilíbrio)","Elevador subindo acelerado: N = m·(g + a)","Elevador descendo acelerado: N = m·(g − a)"],"Balança no elevador: ela mede a normal. Acelerando para cima, marca mais; acelerando para baixo, marca menos; em velocidade constante, marca o peso real.","Uma pessoa de 60 kg está sobre uma balança dentro de um elevador que sobe com aceleração constante de 2 m/s² (para cima). Adote g = 10 m/s².","Qual a intensidade da força normal que a balança exerce sobre a pessoa?",["480 N","600 N","720 N","120 N","72 N"],2,"Subindo com aceleração para cima: N − P = m·a → N = m·(g + a) = 60 × 12 = 720 N. A alternativa A usa g − a (vale para descida acelerada); a B é o peso, que só seria N sem aceleração; a D é só m·a; a E confunde com o valor em kg."],
"Força de atrito":["O atrito surge entre superfícies em contato e se opõe ao movimento (ou à tendência de movimento). O atrito estático age enquanto não há deslizamento e vale o que for preciso, até um valor máximo; o atrito cinético age durante o deslizamento e vale μ·N, geralmente menor que o máximo estático. A intensidade não depende da área de contato, apenas da normal e da natureza das superfícies.",["f<sub>e,máx</sub> = μ<sub>e</sub>·N","f<sub>c</sub> = μ<sub>c</sub>·N","N = P em plano horizontal"],"Primeiro compare a força aplicada com o atrito estático máximo: se for menor, não há movimento e o atrito iguala a força aplicada; se for maior, usa-se o atrito cinético.","Um funcionário empurra um caixote de 50 kg sobre um piso horizontal com uma força de 250 N. Os coeficientes de atrito entre o caixote e o piso são μ<sub>e</sub> = 0,4 (estático) e μ<sub>c</sub> = 0,3 (cinético). Adote g = 10 m/s².","Qual a intensidade da força de atrito que age sobre o caixote?",["50 N","100 N","200 N","150 N","250 N"],3,"N = P = 500 N, e o atrito estático máximo é 0,4 × 500 = 200 N. Como 250 N > 200 N, o caixote desliza, e o atrito passa a ser cinético: f = 0,3 × 500 = 150 N. A alternativa C é o atrito estático máximo, que só vale até o início do deslizamento; a E supõe que o atrito iguala a força aplicada (só vale em repouso); A e B são diferenças que nada têm a ver com o atrito."],
"Força elástica":["Mola esticada ou comprimida exerce uma força que tende a levá-la de volta ao comprimento natural: é a força elástica. Pela Lei de Hooke, ela é proporcional à deformação, dentro do limite elástico. A constante k mede a rigidez da mola. Dinamômetros e balanças de mola funcionam assim: o alongamento é proporcional à força aplicada.",["F<sub>el</sub> = k·x","Unidade de k: N/m","x = deformação (m)"],"Se o alongamento é proporcional à força, vale regra de três; basta uma medida de calibração.","Um dinamômetro de mola é calibrado: ao pendurar um objeto de 300 g, a mola alonga 6 cm. Adote g = 10 m/s². Em seguida, pendura-se nesse mesmo dinamômetro um objeto de 500 g.","Qual o alongamento da mola com o objeto de 500 g, supondo regime elástico?",["10 cm","1 cm","5 cm","0,1 cm","250 cm"],0,"Calibração: F = 3 N e x = 0,06 m → k = 3/0,06 = 50 N/m. Com 500 g: F = 5 N, logo x = F/k = 5/50 = 0,1 m = 10 cm (ou, por proporção, 500/300 × 6 = 10 cm). A alternativa B usa a massa em kg como se fosse força; a C supõe que 5 N corresponde a 5 cm; a D esquece de converter m em cm; a E multiplica F por k."],
"Plano inclinado":["Em um plano inclinado, o peso se decompõe em duas componentes: uma paralela ao plano (P·sen θ), que puxa o corpo para baixo ao longo da rampa, e outra perpendicular (P·cos θ), equilibrada pela normal. Sem atrito, a aceleração é g·sen θ, independente da massa. Quanto maior o ângulo, maior a componente que puxa o corpo.",["P<sub>x</sub> = m·g·sen θ","P<sub>y</sub> = N = m·g·cos θ","a = g·sen θ (sem atrito)","sen 30° = 0,5; cos 30° ≈ 0,87"],"Seno para ao longo da rampa, cosseno para a normal. Em θ = 30°, a componente paralela vale exatamente metade do peso.","Em uma obra, um bloco de 10 kg é largado do alto de uma rampa lisa (sem atrito) inclinada 30° em relação ao solo. Adote g = 10 m/s², sen 30° = 0,5 e cos 30° ≈ 0,87.","Qual a intensidade da força resultante que faz o bloco descer a rampa?",["100 N","87 N","50 N","5 N","Zero"],2,"Sem atrito, a resultante é a componente do peso ao longo do plano: F = m·g·sen 30° = 10 × 10 × 0,5 = 50 N (aceleração de 5 m/s²). A alternativa A é o peso total; a B é a componente perpendicular, equilibrada pela normal; a D confunde a aceleração com a força; a E supõe equilíbrio, o que só ocorre com atrito suficiente."],
"Sistemas de blocos":["Quando dois ou mais blocos estão em contato ou ligados por fios, tratamos primeiro o sistema como um corpo só para achar a aceleração comum (F = m<sub>total</sub>·a). Depois isolamos cada bloco e aplicamos F = m·a para achar as forças internas, como a força de contato ou a tração do fio. A força entre os blocos é um par ação-reação.",["a = F / (m<sub>A</sub> + m<sub>B</sub>)","Bloco isolado: F<sub>R</sub> = m·a"],"Dois passos: (1) sistema inteiro para achar a; (2) bloco isolado para achar a força de contato ou a tração.","Em uma esteira lisa, o bloco A, de 2 kg, é empurrado por uma força horizontal de 20 N e empurra o bloco B, de 3 kg, que está encostado nele na frente. Não há atrito.","Qual a intensidade da força que o bloco A exerce sobre o bloco B?",["12 N","20 N","8 N","4 N","10 N"],0,"Sistema: a = 20/(2 + 3) = 4 m/s². Bloco B: a única força horizontal sobre ele é a de contato, então F = m<sub>B</sub>·a = 3 × 4 = 12 N. A alternativa B supõe que a força integral chega a B; a C usa a massa de A (2 × 4 = 8 N); a D é a aceleração; a E divide a força igualmente (20/2)."],
"Força centrípeta":["Em um movimento circular, a velocidade muda de direção o tempo todo, então há uma aceleração centrípeta, apontando para o centro. A força resultante que a produz é a força centrípeta, que não é uma força nova: pode ser o atrito (carro na curva), a tração (pedra girando), a normal ou o peso. Sem ela, o corpo sai pela tangente, por inércia.",["F<sub>c</sub> = m·v² / R","a<sub>c</sub> = v² / R = ω²·R"],"Se a velocidade dobra, a força centrípeta necessária quadruplica: por isso a velocidade máxima em curvas é limitada pelo atrito.","Um carro de 1 000 kg faz uma curva circular horizontal de raio 50 m com velocidade constante de 10 m/s. Considere que a força centrípeta é fornecida inteiramente pelo atrito dos pneus com a pista.","Qual a intensidade da força de atrito necessária para o carro fazer a curva?",["40 N","200 N","1 000 N","2 000 N","10 000 N"],3,"F<sub>c</sub> = m·v²/R = 1 000 × 10² / 50 = 1 000 × 100 / 50 = 2 000 N. A alternativa A usa R² no lugar de R; a B esquece de elevar v ao quadrado; a C coloca um fator ½ indevido; a E usa m·v."],
"Potência":["Potência mede a rapidez com que a energia é transferida ou transformada: é o trabalho realizado (ou a energia consumida) dividido pelo tempo. Duas máquinas podem realizar o mesmo trabalho, mas a mais potente o faz em menos tempo. Quando a força é constante e paralela ao movimento, a potência também é igual à força vezes a velocidade.",["P = τ / Δt","P = F·v","Unidade: watt (W) = J/s","1 cv ≈ 735 W"],"Potência não é energia: uma lâmpada de 100 W gasta 100 J a cada segundo. Para o trabalho de erguer uma carga, use τ = m·g·h.","Em uma obra, um guindaste ergue uma carga de 500 kg a uma altura de 12 m, com velocidade constante, em 20 s. Adote g = 10 m/s².","Qual a potência média desenvolvida pelo guindaste ao elevar a carga?",["300 W","1 500 W","3 000 W","6 000 W","60 000 W"],2,"τ = m·g·h = 500 × 10 × 12 = 60 000 J. P = τ/Δt = 60 000/20 = 3 000 W. A alternativa A esquece o g; a B usa um fator ½ indevido (que só existe na energia cinética); a D divide por 10 s em vez de 20 s; a E é o trabalho, sem dividir pelo tempo."],
"Energia cinética":["Energia cinética é a energia associada ao movimento. Ela cresce com a massa e, principalmente, com o quadrado da velocidade: dobrar a velocidade quadruplica a energia cinética. O teorema trabalho-energia diz que o trabalho da força resultante é igual à variação da energia cinética.",["E<sub>c</sub> = m·v² / 2","τ<sub>resultante</sub> = ΔE<sub>c</sub>"],"Converta km/h em m/s (÷ 3,6) antes de calcular. Em acidentes, a energia a dissipar cresce com v²: por isso o limite de velocidade é tão importante.","Um caminhão de 2 000 kg trafega em uma rodovia a 72 km/h, velocidade constante, quando o motorista precisa frear.","Qual a energia cinética do caminhão, que os freios precisarão dissipar para pará-lo?",["2,0 × 10⁴ J","4,0 × 10⁴ J","8,0 × 10⁵ J","4,0 × 10⁵ J","5,2 × 10⁶ J"],3,"72 km/h ÷ 3,6 = 20 m/s. E<sub>c</sub> = m·v²/2 = 2 000 × 20² / 2 = 2 000 × 400 / 2 = 4,0 × 10⁵ J. A alternativa C esquece o fator ½; as A e B esquecem de elevar a velocidade ao quadrado; a E usa 72 sem converter para m/s."],
"Energia potencial":["Energia potencial é a energia armazenada em razão da posição ou da deformação de um sistema. A gravitacional depende da altura em relação ao nível de referência; a elástica depende da deformação de uma mola ou de um elástico. Ela pode ser convertida em cinética, como no salto de um brinquedo de mola ou na queda de um objeto.",["E<sub>pg</sub> = m·g·h","E<sub>pe</sub> = k·x² / 2","k em N/m; x em metros"],"Atenção à unidade da deformação: converta cm em m antes de elevar ao quadrado.","Um brinquedo de pular tem uma mola de constante elástica k = 200 N/m, que é comprimida 10 cm quando a criança se agacha para dar o impulso.","Qual a energia potencial elástica armazenada na mola nessa compressão?",["2 J","10 J","1 J","20 J","10 000 J"],2,"x = 10 cm = 0,1 m. E<sub>pe</sub> = k·x²/2 = 200 × 0,1² / 2 = 200 × 0,01 / 2 = 1 J. A alternativa A esquece o fator ½; a B usa k·x/2 (esquece o quadrado); a D usa k·x; a E usa x = 10 sem converter de cm para m."],
"Conservação de energia":["A energia não é criada nem destruída: apenas se transforma de uma forma em outra ou é transferida entre corpos. Em sistemas isolados, a energia total é constante. Quando há atrito ou resistência do ar, parte da energia mecânica se converte em energia térmica (calor) e som; ela não desaparece, mas deixa de ser aproveitável como energia mecânica.",["E<sub>inicial</sub> = E<sub>final</sub> + E<sub>dissipada</sub>","E<sub>dissipada</sub> = E<sub>m inicial</sub> − E<sub>m final</sub>"],"Se a energia mecânica diminuiu, a diferença virou calor: é essa energia dissipada que costuma ser pedida.","Em um parque, uma criança de 20 kg de massa desce em um escorregador (tratada como um bloco) a partir do repouso, de uma altura de 5 m em relação ao solo. Ao chegar à base, sua velocidade é 6 m/s. Adote g = 10 m/s².","Quanta energia mecânica foi dissipada pelo atrito durante a descida?",["640 J","1 000 J","360 J","1 360 J","Nenhuma, pois a energia se conserva"],0,"No topo: E<sub>m</sub> = m·g·h = 20 × 10 × 5 = 1 000 J. Na base: E<sub>c</sub> = m·v²/2 = 20 × 36 / 2 = 360 J. Dissipada = 1 000 − 360 = 640 J, que virou calor. A alternativa B considera toda a energia inicial; a C é a energia cinética final; a D soma as duas; a E vale só sem atrito, e aqui a velocidade final é menor que a de um escorregador ideal (√(2gh) = 10 m/s)."],
"Energias em geral (rendimento e fontes)":["Toda máquina transforma energia, mas só parte dela é útil; o restante é dissipado, em geral como calor. O rendimento é a razão entre a energia (ou potência) útil e a total recebida, e é sempre menor que 100%. As fontes de energia se dividem em renováveis (hídrica, solar, eólica, biomassa) e não renováveis (petróleo, carvão, gás natural, nuclear). No Brasil, a maior parte da eletricidade vem de hidrelétricas.",["η = E<sub>útil</sub> / E<sub>total</sub> = P<sub>útil</sub> / P<sub>total</sub>","1 kWh = 3,6 × 10⁶ J","E = P·Δt"],"Rendimento de 20% significa que só 20% da energia que chega vira energia útil. Trabalhe em kW e horas para obter kWh.","Uma residência instala painéis solares fotovoltaicos com área total de 10 m². Em média, a radiação solar incidente é de 1 000 W/m² durante 5 horas por dia, e os painéis têm rendimento de 20%.","Qual a energia elétrica gerada pelos painéis em um dia?",["2 kWh","10 kWh","40 kWh","50 kWh","10 000 kWh"],1,"Potência incidente = 1 000 × 10 = 10 000 W = 10 kW. Potência útil = 0,20 × 10 = 2 kW. Energia = 2 kW × 5 h = 10 kWh. A alternativa A esquece o tempo; a C usa 80% (a perda) como rendimento; a D ignora o rendimento (10 kW × 5 h); a E esquece de converter W em kW."],
"Temperatura e escalas":["Temperatura mede o grau de agitação das partículas de um corpo. As escalas mais usadas são Celsius (água congela a 0 °C e ferve a 100 °C), Fahrenheit (32 °F e 212 °F) e Kelvin (escala absoluta, em que 0 K é o menor valor possível). Entre dois pontos fixos, as divisões são proporcionais, o que dá as fórmulas de conversão.",["T<sub>K</sub> = T<sub>C</sub> + 273","T<sub>F</sub> = 1,8·T<sub>C</sub> + 32","T<sub>C</sub>/5 = (T<sub>F</sub> − 32)/9","ΔC = ΔK = ΔF·5/9"],"O ENEM costuma pedir uma conversão simples. Variações de temperatura valem o mesmo em °C e em K, mas não em °F.","Um turista norte-americano usa um termômetro em °F para medir a temperatura da filha, que está com febre. Em graus Celsius, a menina está com 39 °C.","Qual valor, em °F, o termômetro marcará?",["38,2 °F","70,2 °F","71 °F","53,7 °F","102,2 °F"],4,"T<sub>F</sub> = 1,8 × 39 + 32 = 70,2 + 32 = 102,2 °F. A alternativa A subtrai 32 em vez de somar; a B esquece de somar 32; a C soma 32 sem multiplicar por 1,8; a D usa o fator 5/9, que serve para converter de °F para °C."],
"Dilatação térmica":["Quando aquecidos, os sólidos aumentam de dimensões, porque o aumento da agitação térmica afasta as partículas. A dilatação linear é proporcional ao comprimento inicial, ao coeficiente de dilatação do material e à variação de temperatura. Por isso trilhos, pontes e calçadas têm juntas de dilatação. Na água, há exceção: entre 0 °C e 4 °C o volume diminui com o aquecimento.",["ΔL = L₀·α·ΔT","ΔA = A₀·2α·ΔT","ΔV = V₀·3α·ΔT"],"Use sempre a VARIAÇÃO de temperatura (final − inicial), e converta o resultado para a unidade pedida (mm, cm ou m).","Em uma ferrovia, trilhos de aço de 20 m de comprimento são assentados com pequenas folgas entre si. O coeficiente de dilatação linear do aço é 1,2 × 10⁻⁵ °C⁻¹. A temperatura no local varia de 10 °C, de madrugada, a 40 °C, no meio da tarde.","Qual o aumento de comprimento de cada trilho entre os dois horários?",["2,4 mm","7,2 mm","7,2 cm","9,6 mm","600 m"],1,"ΔT = 40 − 10 = 30 °C. ΔL = 20 × 1,2 × 10⁻⁵ × 30 = 7,2 × 10⁻³ m = 7,2 mm. A alternativa A usa ΔT = 10 °C (a temperatura inicial); a D usa 40 °C (a final); a C erra a conversão de unidade; a E esquece o coeficiente α."],
"Mudanças de estado":["As mudanças de estado são fusão (sólido → líquido), vaporização (líquido → gás), condensação, solidificação e sublimação. Durante a mudança, a substância recebe ou cede calor, mas sua temperatura permanece constante (patamar no gráfico T × Q): a energia é usada para romper ligações, não para agitar mais as partículas. Esse calor é o calor latente.",["Q = m·L","L<sub>fusão gelo</sub> = 80 cal/g","L<sub>vaporização água</sub> = 540 cal/g"],"Num gráfico de aquecimento, os trechos horizontais indicam mudança de estado e os inclinados indicam calor sensível.","Para manter alimentos frios em um piquenique, usa-se uma caixa térmica com 500 g de gelo a 0 °C. O calor latente de fusão do gelo é 80 cal/g.","Qual a quantidade de calor que o gelo deve absorver para derreter totalmente, ainda a 0 °C?",["40 kcal","Zero, pois a temperatura não varia","40 cal","6,25 cal","400 kcal"],0,"Q = m·L = 500 × 80 = 40 000 cal = 40 kcal. Embora a temperatura não varie durante a fusão, há troca de calor (latente), o que descarta a B. A alternativa C erra a conversão para kcal; a D divide m por L; a E erra a potência de dez."],
"Propagação de calor":["O calor se propaga de três modos. Na condução, a energia passa de partícula a partícula, sem transporte de matéria, e ocorre sobretudo nos sólidos (metais são bons condutores). Na convecção, correntes de fluido (ar ou líquido) transportam o calor: o fluido quente, menos denso, sobe, e o frio, mais denso, desce. Na irradiação, o calor viaja por ondas eletromagnéticas (infravermelho), inclusive no vácuo, como o do Sol.",["Condução: Φ = k·A·ΔT / L","Convecção: fluido quente sobe, frio desce","Irradiação: ondas eletromagnéticas"],"Questões clássicas: geladeira (convecção), garrafa térmica (vácuo evita condução e convecção; paredes espelhadas reduzem irradiação) e cabo de panela (isolante térmico).","Nas geladeiras domésticas, o congelador fica na parte superior e, mesmo sem ventilador, todo o interior se resfria.","Qual processo principal de transferência de calor explica esse resfriamento?",["Condução, pois o ar frio transmite calor às prateleiras de metal.","Irradiação, pois o congelador emite ondas de frio que chegam aos alimentos.","Condução, pois o ar é bom condutor térmico e distribui o frio por igual.","Convecção: o ar frio, mais denso, desce e o ar quente, menos denso, sobe até o congelador, formando correntes que resfriam todo o interior.","Convecção: o ar quente, mais denso, desce e troca calor com o congelador."],3,"Perto do congelador o ar esfria, fica mais denso e desce; o ar quente, menos denso, sobe e é resfriado. Essas correntes de convecção resfriam toda a geladeira. A alternativa E inverte a relação entre temperatura e densidade; o ar é mau condutor (A e C); e não existem ondas de frio: o que há é calor saindo dos alimentos (B)."],
"Gases ideais":["Um gás ideal é descrito por três variáveis de estado: pressão, volume e temperatura absoluta (em kelvin). Para uma massa fixa de gás, vale a lei geral dos gases. Casos particulares: isotérmica (T constante, P·V constante), isobárica (P constante, V/T constante) e isocórica (V constante, P/T constante).",["P·V = n·R·T","P₁V₁/T₁ = P₂V₂/T₂","Isocórica: P₁/T₁ = P₂/T₂","T (K) = T (°C) + 273"],"A pegadinha número 1 é usar °C na conta. Converta SEMPRE para kelvin antes de aplicar as leis dos gases.","Um recipiente rígido e fechado contém ar à pressão absoluta de 2,0 atm e à temperatura de 27 °C. Deixado ao sol, ele aquece e chega a 87 °C. Considere que o volume não varia e que o ar se comporta como gás ideal.","Qual passa a ser a pressão absoluta do ar no recipiente?",["2,4 atm","6,4 atm","2,0 atm","1,7 atm","4,0 atm"],0,"Volume constante: P₁/T₁ = P₂/T₂, com T₁ = 300 K e T₂ = 360 K. P₂ = 2,0 × 360/300 = 2,4 atm. A alternativa B usa °C (2,0 × 87/27); a C ignora o aquecimento; a D inverte a razão das temperaturas; a E dobra a pressão sem base na conta."],
